<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Split">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Trip Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --dim:#475569; --faint:#94a3b8;
    --line:#e2e8f0; --edge:#cbd5e1;
    --brand:#e61e4d; --pos:#047857; --neg:#c81e1e;      /* all >= 4.5:1 on white */
    --tint-brand:#fff0f3; --tint-pos:#ecfdf5; --tint-neg:#fef2f2;
    --sh:none;
    --t:170ms cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;

    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  /* One ring for every control, so tabbing never loses the cursor. */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
  nav button:focus-visible{outline-offset:-4px}
  input,select{font-family:inherit;color:inherit}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .wrap{max-width:540px;margin:0 auto;padding:0 16px}
  .n{font-variant-numeric:tabular-nums}

  /* header */
  header{background:transparent;padding:24px 0 26px;position:relative;z-index:2}
  /* Fixed, so it is out of flow and can never shift what is behind it. */
  #minibar{position:fixed;top:0;left:0;right:0;z-index:22;padding:10px 0;
    background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(-102%);pointer-events:none;
    transition:opacity 200ms ease, transform 300ms cubic-bezier(.22,1,.36,1)}
  #minibar.on{opacity:1;transform:none;pointer-events:auto}
  #minibar .wrap{display:flex;align-items:center;gap:10px}
  #minibar b{font-size:16px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
  #minibar .status{font-size:12.5px;padding:5px 12px;box-shadow:none}
  .mininame{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim)}
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    #minibar{-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px)}
  }
  /* a scrim, so white text holds over whichever photo is behind it */
  header::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(15,23,42,.50), rgba(15,23,42,.22) 60%, rgba(15,23,42,0))}
  .hrow{display:flex;align-items:baseline;gap:12px}
  header h1{font-size:27px;font-weight:700;letter-spacing:-.035em;color:#fff;
    text-shadow:0 1px 14px rgba(15,23,42,.45)}
  .trip{font-size:13.5px;color:rgba(255,255,255,.93);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 10px rgba(15,23,42,.5)}
  .role{margin-left:auto;font-size:12px;color:#fff;font-weight:600;white-space:nowrap;
    background:rgba(15,23,42,.86);border-radius:100px;padding:5px 12px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .statusrow{margin-top:14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .status{display:inline-flex;align-items:center;gap:7px;border-radius:100px;
    padding:8px 15px;font-size:13.5px;font-weight:600;background:#fff;color:#c2183f;
    box-shadow:0 2px 10px rgba(15,23,42,.16);
    transition:background var(--t), color var(--t)}
  .statusnote{font-size:12.5px;color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(15,23,42,.5)}



  .status.ok{background:var(--tint-pos);color:var(--pos)}
  .status.idle{background:var(--bg);color:var(--dim)}

  /* bottom tab bar */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.84);
    border-top:1px solid rgba(255,255,255,.6);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  /* The tab bar was given the translucent background but not the blur, so the
     ledger behind it showed through sharp. Same treatment as the header. */
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    nav{-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px)}
  }
  nav button{flex:1;border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--dim);letter-spacing:.01em}
  nav button.on{color:#c2183f}   /* deeper than --brand: 10.5px labels need the full 4.5:1 */
  nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  /* cards */
  main{padding-top:16px}
  /* Frosted cards. Any browser without backdrop-filter simply gets the solid
     colour underneath, which is what the app looked like before. */
  section{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.85);
    border-radius:20px;padding:18px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 30px -18px rgba(15,23,42,.32)}
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    section{-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px)}
  }
  .shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .kicker{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  /* The line under a card heading gives every section the same opening beat. */
  section>.shead{padding-bottom:12px;border-bottom:1px solid var(--line)}
  section>.shead+.hint{margin-top:12px}
  .hint{font-size:13.5px;color:var(--dim);line-height:1.5}
  .hint b{color:var(--ink);font-weight:600}

  /* fields */
  label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:7px}
  .f{width:100%;font-size:16px;padding:14px 15px;border:1px solid var(--edge);border-radius:12px;background:var(--card)}
  .f:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .f.num{font-variant-numeric:tabular-nums;font-weight:600}
  .money{display:flex;align-items:center;border:1px solid var(--edge);border-radius:12px;background:var(--card);padding-left:14px}
  .money:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .money span{font-size:15px;color:var(--dim);font-weight:600}
  .money input{flex:1;min-width:0;border:0;background:none;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;padding:14px 14px 14px 5px}
  .money.big span{font-size:21px}
  .money.big input{font-size:25px;font-weight:700;letter-spacing:-.02em;padding:14px 14px 14px 7px}
  .money input:focus{outline:none}
  .duo{display:flex;gap:10px}
  .duo>*{flex:1;min-width:0}

  /* buttons */
  .btn{width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:15px;
    font-size:16px;font-weight:600;margin-top:20px;transition:background var(--t),filter var(--t)}
  .btn:active{filter:brightness(.93)}
  .opt,.go,.x,.link,nav button{transition:color var(--t),background var(--t),border-color var(--t)}
  .row,.frow,.legrow{transition:background var(--t)}
  .btn.line{background:var(--card);color:var(--ink);border:1px solid var(--ink);font-size:14.5px;padding:12px}
  .link{border:0;background:none;padding:7px 0;font-size:13.5px;font-weight:600;color:var(--ink);
    text-decoration:underline;text-underline-offset:3px;min-height:24px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .faces{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:11px}
  .face{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;
    padding:4px 0;font-size:10.5px;font-weight:600;color:var(--dim);min-height:44px;
    transition:color var(--t),opacity var(--t)}
  .face .ini{width:38px;height:38px;font-size:12.5px;background:var(--edge);color:var(--dim);
    transition:background var(--t),color var(--t)}
  .face.on{color:var(--ink)}
  .face.on .ini{background:var(--ink);color:#fff}
  .face:not(.on){opacity:.55}
  .opts.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .opts.grid .opt{padding:10px 4px;font-size:13px;text-align:center;white-space:nowrap}
  .opt{border:1px solid rgba(15,23,42,.14);background:rgba(255,255,255,.6);border-radius:100px;padding:9px 16px;
    font-size:14px;font-weight:600;color:var(--ink)}
  .opt.on{border-color:var(--ink);background:var(--ink);color:#fff}

  /* rows */
  .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  section>.shead+.row,
  section>.shead+*>.row:first-child,
  section>.shead+.hint+.row{border-top:0}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:13px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    text-align:right;flex-shrink:0}
  .tag{font-size:11px;font-weight:600;color:var(--dim);background:var(--bg);border-radius:100px;
    padding:5px 11px;flex-shrink:0}
  .ini{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:600}
  .x{border:0;background:none;padding:7px 2px;font-size:12.5px;color:var(--dim);
    text-decoration:underline;text-underline-offset:2px;min-height:24px}
  .empty{padding:30px 0;font-size:14px;color:var(--dim);text-align:center}
  .daybar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:20px 0 4px;border-top:1px solid var(--line);margin-top:6px}
  .daybar:first-child{border-top:0;padding-top:0;margin-top:0}
  .daybar b{font-size:13px;font-weight:700}
  .daybar span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}

  /* settlement */
  .arrow{color:var(--faint);font-weight:400}
  .settled{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);
    font-size:14px;color:var(--dim)}
  .settled:first-child{border-top:0}
  .settled .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .allsquare{padding:34px 0;text-align:center}
  .allsquare b{display:block;font-size:17px;font-weight:700;margin-bottom:4px}

  /* One photo of the trip behind the whole app, per tab. Faint enough to read
     over, present enough that the frosted panels have something to blur. */
  /* A full-page photo behind near-full-width cards only ever shows as a sliver
     down each side. It gets the top of the screen to itself instead, and fades
     into a calm surface for the content. */
  #shot{position:absolute;top:0;left:0;right:0;height:304px;z-index:-1;
    background-size:cover;background-position:center;transition:opacity 300ms ease;
    -webkit-mask-image:linear-gradient(180deg,#000 56%,transparent);
    mask-image:linear-gradient(180deg,#000 56%,transparent)}

  /* dialogs, sheets, toast */
  body.locked{overflow:hidden}
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.35);
    display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 150ms ease}
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    .scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .sheet,.dialog{-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
  }
  .scrim.mid{align-items:center;padding:20px}
  .sheet{width:100%;max-width:540px;background:rgba(255,255,255,.86);border-radius:22px 22px 0 0;
    padding:6px 0 max(10px,env(safe-area-inset-bottom));animation:slideUp 220ms cubic-bezier(.4,0,.2,1);
    border-top:1px solid rgba(255,255,255,.7)}
  .sheetHead{font-size:12.5px;font-weight:600;color:var(--dim);padding:16px 22px 8px}
  .sheetItem{display:flex;align-items:center;width:100%;border:0;background:none;
    padding:15px 22px;font-size:16px;text-align:left;color:var(--ink);min-height:44px}
  .sheetItem.on{font-weight:700}
  .sheetItem .tick{margin-left:auto;color:var(--brand);font-weight:700;visibility:hidden}
  .sheetItem.on .tick{visibility:visible}
  .dialog{width:100%;max-width:400px;background:rgba(255,255,255,.9);border-radius:20px;padding:22px;
    animation:popIn 170ms cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.7);
    box-shadow:0 24px 60px -20px rgba(15,23,42,.4)}
  .dTitle{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
  .dBody{font-size:14px;color:var(--dim);margin-top:8px;line-height:1.5}
  .dPre{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.5;
    background:var(--bg);border-radius:10px;padding:12px;word-break:break-all;user-select:all}
  .dActs{display:flex;gap:10px;margin-top:20px}
  .dActs .btn{margin-top:0}
  .btn.danger{background:var(--neg)}
  #toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;
    background:rgba(15,23,42,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    color:#fff;border-radius:100px;padding:11px 20px;font-size:13.5px;
    font-weight:600;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px);
    transition:opacity var(--t),transform var(--t)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Only while the "enter" class is on, so a re-render mid-typing does not
     make the whole page jump about. */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #view.enter>section{animation:rise 300ms cubic-bezier(.22,1,.36,1) both}
  #view.enter>section:nth-child(2){animation-delay:45ms}
  #view.enter>section:nth-child(3){animation-delay:90ms}
  #view.enter>section:nth-child(4){animation-delay:130ms}
  #view.enter>section:nth-child(n+5){animation-delay:165ms}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .pick{width:100%;display:flex;align-items:center;font-size:16px;font-weight:600;
    padding:14px 15px;border:1px solid var(--edge);border-radius:12px;background:var(--card);
    color:var(--ink);text-align:left}
  .pick::after{content:"";margin-left:auto;width:7px;height:7px;flex-shrink:0;
    border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
    transform:rotate(45deg) translateY(-2px)}

  /* navigation */
  .navbar{background:rgba(15,23,42,.86);color:#fff;border-radius:18px;padding:17px 19px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 32px -16px rgba(15,23,42,.5)}
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    .navbar{-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px)}
  }
  .navtop{display:flex;align-items:flex-start;gap:14px}
  .navicon{width:40px;height:40px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .mearrow{width:26px;height:26px;margin:-13px 0 0 -13px;transition:transform 300ms linear}
  .mearrow svg{width:26px;height:26px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .mapbar{display:flex;gap:7px;align-items:center;margin:12px 0 0;flex-wrap:wrap}
  .mapbar .opt{padding:7px 13px;font-size:13px}
  .compass{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;
    color:var(--dim);font-weight:600}
  .compass svg{width:19px;height:19px;transition:transform 300ms linear}
  .leaflet-control-attribution{font-size:9.5px;background:rgba(255,255,255,.75)}
  .navtop .dist{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.1;flex-shrink:0}
  .navtop .big{font-size:17px;font-weight:600;letter-spacing:-.015em}
  .navtop .sub{font-size:12.5px;opacity:.7;margin-top:3px}
  .navfoot{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:13px;
    border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;opacity:.85}
  .navfoot button{margin-left:auto;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;
    border-radius:100px;padding:6px 14px;font-size:12.5px;font-weight:600}
  .navalt{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .navalt button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:100px;
    padding:7px 13px;font-size:12px;font-weight:600;opacity:.65;min-height:24px}
  .navalt button.on{opacity:1;background:rgba(255,255,255,.16);border-color:transparent}

  /* route */
  #map{height:340px;border-radius:12px;margin-bottom:14px;background:var(--bg);z-index:0}
  .leaflet-container{font:inherit}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .maplegend{display:flex;flex-wrap:wrap;gap:12px 16px;margin:14px 0 0;font-size:11.5px;color:var(--dim)}
  .maplegend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
  .leg{position:relative;padding:0 0 0 28px}
  .leg::before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--line)}
  .leg:last-child::before{display:none}
  .dot{position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;
    background:var(--card);border:2px solid var(--edge)}
  .leg.big .dot{border-color:var(--brand);background:var(--brand)}
  .leg.see .dot{width:11px;height:11px;left:3px;top:9px}
  .leg.see .legrow{padding-left:16px}
  .leg.see .t{font-size:14px;font-weight:500}
  .leg.see .s{font-size:12.5px}
  .legrow{display:flex;align-items:flex-start;gap:10px;padding:6px 0 18px}
  .legrow .body{flex:1;min-width:0}
  .legrow .t{font-size:15px;font-weight:600}
  .leg.big .t{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .legrow .s{font-size:13px;color:var(--dim);margin-top:1px}
  .go{flex-shrink:0;border:1px solid var(--edge);background:var(--card);border-radius:100px;
    padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .road{border-top:1px solid var(--line);padding:14px 0}
  .road:first-child{border-top:0;padding-top:0}
  .road .t{font-size:14.5px;font-weight:600}
  .road .s{font-size:12.5px;color:var(--dim);margin-top:2px}
  .plaza{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .plaza span{font-size:11.5px;font-weight:600;color:var(--dim);background:var(--bg);
    border-radius:100px;padding:4px 10px}
  .who2do{display:flex;gap:12px;margin:-4px 0 18px}
  .who2do>div{flex:1;min-width:0;background:var(--bg);border-radius:12px;padding:13px 14px}
  .who2do b{display:block;font-size:14px;margin-bottom:3px}
  .who2do span{font-size:12.5px;color:var(--dim);line-height:1.45;display:block}
  .live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-top:2px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--pos);flex-shrink:0;

<script>
const FRIENDS = ["Archit","Satwik","Kripansh","Tejas","Akshat"];
const OWNER = "Tejas";   // the one holding the owner link; everyone else reads only
const TRIP = "Delhi · Neemrana · Bhangarh Fort · Chittorgarh Fort · Udaipur · 8–11 Sep";
// The header has one line to play with, and every stop is on the Route tab.
const TRIP_SHORT = "Delhi · Udaipur · 8–11 Sep";

// ---- the shared ledger ----
// The key below is meant to be public — on its own it can reach nothing. Every
// table has RLS on with no policies and no grants, so the only way in is the
// three functions, and each one asks for a token before it hands anything over.
// The owner secret can write. A member token can only read.
const SB_URL = "https://blqllckizxsisvlnnsgl.supabase.co";
const SB_KEY = "sb_publishable_DXfw_KDpFMgxmmWFvfxgFg_UWzvhJ2r";

async function rpc(fn, args){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(args),
  });
  if(!r.ok) throw new Error("rpc "+fn+" failed: "+r.status);
  return r.json();
}

const CATS = { car:"Car", fuel:"Fuel", toll:"Toll", stay:"Stay", food:"Food", activity:"Activity", misc:"Misc" };

// The loop, in the order we actually drive it. Coordinates are what the map
// links are built from, so they have to be the real place, not the town centre
// where that differs (Char Dukan is up in Landour, not on Mall Road).
const STOPS = [
  { name:"Samaypur Badli",   note:"Start",                          lat:28.7387, lng:77.1385, kind:"stop" },
  { name:"Neemrana",         note:"Fort-Palace, a natural overnight halt", lat:27.9938, lng:76.3884, kind:"stop" },
  { name:"Bhangarh Fort",    note:"India's most-talked-about “haunted” fort", lat:27.0955, lng:76.2878, kind:"stop" },
  { name:"Chittorgarh Fort", note:"The largest fort complex in India", lat:24.8817, lng:74.6467, kind:"stop" },
  { name:"Meera Temple",     note:"Inside the fort, ~1km walk",      lat:24.8904, lng:74.6450, kind:"see" },

  { name:"Udaipur",          note:"City of Lakes",                  lat:24.5761, lng:73.6836, kind:"stop" },
  { name:"Lake Pichola",     note:"The lake the city is built around", lat:24.5696, lng:73.6722, kind:"see" },
  { name:"Jagdish Temple",   note:"Carved Hindu temple, 1651",       lat:24.5807, lng:73.6846, kind:"see" },
  { name:"Bagore Ki Haveli", note:"Haveli museum · the Dharohar dance show at night", lat:24.5797, lng:73.6824, kind:"see" },
  { name:"Monsoon Palace",   note:"Sajjangarh, hilltop sunset",      lat:24.5932, lng:73.6395, kind:"see" },
  { name:"Saheliyon Ki Bari", note:"Garden of the maidens, fountains", lat:24.6031, lng:73.6855, kind:"see" },
  { name:"Ambrai Ghat",      note:"Best sunset view of City Palace", lat:24.5777, lng:73.6799, kind:"see" },
  { name:"Gangaur Ghat",     note:"On Lake Pichola, near the old city", lat:24.5805, lng:73.6826, kind:"see" },
  { name:"Fateh Sagar Lake", note:"Second lake, north of the city",  lat:24.6021, lng:73.6721, kind:"see" },
  { name:"Karni Mata Temple", note:"Hilltop temple, ropeway up",     lat:24.5660, lng:73.6892, kind:"see" },
  { name:"Shilpgram",        note:"Rural arts-and-crafts village",   lat:24.6131, lng:73.6634, kind:"see" },
  { name:"Vintage Car Museum", note:"The Maharana's old car collection", lat:24.5761, lng:73.6945, kind:"see" },
  { name:"Bada Bazaar",      note:"Old-city shopping street",        lat:24.5814, lng:73.6900, kind:"see" },
  { name:"Ambrai Restaurant", note:"Lakeside dining, City Palace view", lat:24.5782, lng:73.6800, kind:"see" },

  { name:"Samaypur Badli",   note:"Back home",                       lat:28.7387, lng:77.1385, kind:"stop" },
];

// Distance and time on every leg came from OSRM, the same routing engine the
// in-app map uses - not estimated. Highway names are given only where they are
// certain; the Bhangarh detour runs through smaller roads whose exact numbers
// are not worth guessing at. Toll plazas on this route are not named for the
// same reason - NH-48 has FASTag tolls throughout, Maps will show the live
// amount when you actually drive it.
const ROADS = [
  { leg:"Delhi → Neemrana", via:"NH-48",
    tolls:["Tolls apply · FASTag, live pricing in Maps"], note:"~139km · 1 hr 53 min" },
  { leg:"Neemrana → Bhangarh Fort", via:"Off NH-48, via Alwar on smaller roads",
    tolls:[], note:"~149km · 2 hr 5 min" },
  { leg:"Bhangarh Fort → Chittorgarh Fort", via:"Via Jaipur, then toward Bhilwara",
    tolls:["Tolls apply · FASTag, live pricing in Maps"], note:"~386km · 5 hrs — by far the longest single leg" },
  { leg:"Chittorgarh Fort → Udaipur", via:"NH-48",
    tolls:["Tolls apply · FASTag, live pricing in Maps"], note:"~121km · 1 hr 36 min" },
  { leg:"Udaipur → Delhi", via:"NH-52 direct, via Jaipur — not retracing the forts",
    tolls:["₹1,445 in tolls (verified, one way)"], note:"709km · 8 hr 50 min · ₹4,505 in petrol" },
];

// The one genuinely fixed cost. Everything else gets decided on the road and
// logged as it is actually paid.
const CAR_RATE = 3300;
const CAR_DAYS = 3;

// Planning projection only — never touches anyone's balance.
// This route is not a scaled-up version of the old one. Delhi -> Udaipur via
// the three forts is ~795km one way (OSRM); the direct return is ~675km —
// round trip ~1,470km, against ~560km for the old Mussoorie loop. Almost all
// of it is highway/plains, not the hill climb the old petrol-buffer line was
// costing. cngKm below is that full round trip on the assumption the car can
// run CNG the whole way — that needs your own check, not mine: CNG station
// coverage through rural Alwar/Rajgarh and around the forts is not something
// I can verify. petKm is a placeholder for local running around Udaipur and
// the forts (Monsoon Palace's climb, driving between ghats and museums) —
// tune it once you know the actual plan.
// Mileage is deliberately worst-case — a retrofitted CNG kit on a loaded
// Creta, and petrol on steep sections with five up, luggage and the AC running.
const PLAN = {
  // 795km outbound via the forts (OSRM) + 709km direct return (a real toll
  // calculator, not OSRM) = 1,504km round trip.
  cngKm:1504, cngEff:12, cngRate:85,   // round trip, on the CNG-the-whole-way assumption above
  petKm:60,   petEff:9,  petRate:105,  // guessed local running in and around Udaipur - fix this
  buffer:60,                           // Monsoon Palace climb, ghat-to-ghat, museum hopping
  toll:1445,                           // verified for the direct return only - outbound-via-forts not priced, likely more
};

const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = f => f.slice(0,2).toUpperCase();
const num = v => Number(v)||0;
const N = FRIENDS.length;

// ---- state ----
let state = {
  // expense: {id, ts, cat, desc, payer, mode, shares:{name:rupees}}
  // shares is the whole truth — who owes what for this bill. "equal" mode fills
  // it by dividing five ways, "each" mode fills it from what each person's own
  // item actually cost. calc() never needs to know which was used.
  expenses: [],
  paybacks: [],   // {id, ts, from, to, amount} — cash actually handed over
  plan: {...PLAN, rate:CAR_RATE, days:CAR_DAYS},
  tab:"log", cat:"food", payer:FRIENDS[0], openPerson:null, showPlan:false,
  mode:"equal", draft:{},   // draft holds the per-person amounts being typed
  editing:null,             // id of the expense being changed, if any
  who:[...FRIENDS],         // who this particular bill is split between
  payers:[FRIENDS[0]],      // who put money in; more than one is allowed
  paid:{},                  // how much each of them put in, when it is several
  desc:"", amt:"",          // kept here so a re-render cannot throw them away

  // who is looking: "owner" can change things, "viewer" can only read
  role:null, me:null, meFriend:null, members:[], upi:{}, locations:[],
  sharing:false, geoWatch:null,
  gate:"loading",           // null once we have a session; otherwise which screen to show
  gateMsg:"", joinToken:null, showOwnerLink:false,
};
const canEdit = () => state.role === "owner";
// Your own row: yours to fix or remove, whoever you are.
const canTouch = e => canEdit() || (e && e.payer === whoAmI());

// Expenses saved before per-item splitting existed only had a total; treat those
// as an even split so old entries keep working.
// Who put money in for this bill, and how much. Rows from before bills could
// have two payers just have the one, for the whole amount.
const paidOf = e => (e.paidBy && Object.keys(e.paidBy).length)
  ? e.paidBy
  : { [e.payer]: amtOf(e) };

const sharesOf = e => e.shares || Object.fromEntries(
  splitEqual(Math.round(num(e.amount)), N, 0).map((v,i)=>[FRIENDS[i],v]));
const amtOf = e => FRIENDS.reduce((s,f)=>s+Math.round(num(sharesOf(e)[f])),0);
const draftTotal = () => FRIENDS.reduce((s,f)=>s+Math.round(num(state.draft[f])),0);

// ---- session ----
// One key in localStorage is the whole login: the owner secret for me, a member
// token for everyone else. The server decides which it is; the app never does.
const KK = "tripsplit5:key", CK = "tripsplit5:cache", JK = "tripsplit5:join",
      MK = "tripsplit5:migrated", IK = "tripsplit5:installed",
      SHK = "tripsplit5:noshare", RK = "tripsplit5:roadline-udaipur", TK = "tripsplit5:tab",
      MSK = "tripsplit5:mapstyle";
let KEY = null;

function ls(k, v){
  try{ return v===undefined ? localStorage.getItem(k) : (localStorage.setItem(k,v), v); }
  catch(e){ return null; }
}

// The last ledger we saw, kept so the app still opens something useful in the
// hills with no signal. It is a cache, never the source of truth.
function applyLedger(d, cache){
  state.role     = d.role;
  state.me       = d.me || null;
  state.expenses = d.expenses || [];
  state.paybacks = d.paybacks || [];
  state.members  = d.members  || [];
  state.upi      = d.upi      || {};
  state.meFriend = d.meFriend || null;
  state.locations= d.locations|| [];
  state.plan     = {...PLAN, rate:CAR_RATE, days:CAR_DAYS, ...(d.plan || {})};
  state.gate     = null;
  if(cache !== false) ls(CK, JSON.stringify(d));
}

// Every change goes through here. Nothing is written locally first - if the
// server did not take it, it did not happen, and the form keeps what you typed.
// (There was an offline queue here. It replayed a queued "add" after the row
// had been deleted, so deleted expenses came back, and it was not worth the
// trouble it caused.)
// A member may log a payment they made and take it back again. The server
// stamps the payer from their token, so "who paid" is never something the
// client gets to claim.
const MEMBER_OPS = ["add_expense", "edit_expense", "del_expense"];
const mayWrite = op => canEdit() || MEMBER_OPS.includes(op);

async function push(op, data){
  if(!mayWrite(op)) return false;
  try{
    const res = canEdit()
      ? await rpc("owner_apply",  {p_secret:KEY, p_op:op, p_data:data||{}})
      : await rpc("member_apply", {p_token:KEY,  p_op:op, p_data:data||{}});
    if(res.error){ await ui.alert(res.error); return false; }
    applyLedger(res);
    return true;
  }catch(e){
    await ui.alert("Not saved", "No signal. Try again once you are back online.");
    return false;
  }finally{
    render();
  }
}

async function refresh(){
  const d = await rpc("get_ledger", {p_token:KEY});
  if(d.role === "none"){
    ls(KK, ""); KEY = null;
    state.gate = "badkey";
    state.gateMsg = "That link no longer works. Ask Tejas for a fresh one.";
    return;
  }
  applyLedger(d);
}

// The one-time lift of this browser's pre-shared-ledger data ran back when the
// app went online, and the trip has lived on the server ever since. It is gone
// now: it only fired into an empty ledger, which is exactly the state you are
// in right after Clear all - so it could put months-old rows back on a ledger
// you had just deliberately emptied. The legacy keys are cleared instead.
function dropLegacy(){
  for(const k of ["tripsplit4:expenses","tripsplit4:paybacks","tripsplit4:plan"]){
    try{ localStorage.removeItem(k); }catch(e){}
  }
}

// ---- dialogs ----
// The OS select and alert/confirm cannot be styled at all - on Android they
// came up in the system dark theme over a light app. These are the same three
// jobs done in the app's own skin, and they hand back a promise so the call
// sites read the way the blocking versions did.
let modalResolve = null;

function shutModal(value){
  document.getElementById("modal").innerHTML = "";
  document.body.classList.remove("locked");
  removeEventListener("keydown", onModalKey);
  const r = modalResolve; modalResolve = null;
  if(r) r(value);
}
function onModalKey(e){
  if(e.key === "Escape"){ e.preventDefault(); shutModal(null); }
}
function openModal(html){
  return new Promise(resolve => {
    if(modalResolve) shutModal(null);      // never stack two
    modalResolve = resolve;
    document.getElementById("modal").innerHTML = html;
    document.body.classList.add("locked");
    addEventListener("keydown", onModalKey);
    const first = document.querySelector("#modal [data-focus]") || document.querySelector("#modal button");
    if(first) first.focus();
  });
}

const ui = {
  pick: (title, options, current) => openModal(`
    <div class="scrim" onclick="if(event.target===this)shutModal(null)">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheetHead">${esc(title)}</div>
        ${options.map(o=>`<button class="sheetItem ${o===current?"on":""}" ${o===current?"data-focus":""}
           onclick="shutModal(${jq(o)})">${esc(o)}<span class="tick">✓</span></button>`).join("")}
      </div>
    </div>`),

  confirm: (title, opt={}) => openModal(`
    <div class="scrim mid" onclick="if(event.target===this)shutModal(false)">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dTitle">${esc(title)}</div>
        ${opt.body?`<div class="dBody">${esc(opt.body)}</div>`:""}
        <div class="dActs">
          <button class="btn line" onclick="shutModal(false)">Cancel</button>
          <button class="btn ${opt.danger?"danger":""}" data-focus onclick="shutModal(true)">${esc(opt.ok||"Yes")}</button>
        </div>
      </div>
    </div>`),

  alert: (title, body) => openModal(`
    <div class="scrim mid" onclick="if(event.target===this)shutModal()">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dTitle">${esc(title)}</div>
        ${body?`<div class="dBody">${esc(body)}</div>`:""}
        <div class="dActs"><button class="btn" data-focus onclick="shutModal()">OK</button></div>
      </div>
    </div>`),

  // asks for one line of text; resolves to the string, or null if cancelled
  ask: (title, opt={}) => openModal(`
    <div class="scrim mid" onclick="if(event.target===this)shutModal(null)">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dTitle">${esc(title)}</div>
        ${opt.body?`<div class="dBody">${esc(opt.body)}</div>`:""}
        <label class="lbl" for="ask-in" style="margin-top:14px">${esc(opt.label||"")}</label>
        <input class="f" id="ask-in" data-focus inputmode="${esc(opt.inputmode||"text")}"
          placeholder="${esc(opt.placeholder||"")}"
          onkeydown="if(event.key==='Enter')shutModal(document.getElementById('ask-in').value)">
        <div class="dActs">
          <button class="btn line" onclick="shutModal(null)">Cancel</button>
          <button class="btn" onclick="shutModal(document.getElementById('ask-in').value)">${esc(opt.ok||"Save")}</button>
        </div>
      </div>
    </div>`),

  // when the clipboard is blocked, show the text so it can be selected by hand
  show: (title, text) => openModal(`
    <div class="scrim mid" onclick="if(event.target===this)shutModal()">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dTitle">${esc(title)}</div>
        <div class="dPre">${esc(text)}</div>
        <div class="dActs"><button class="btn" data-focus onclick="shutModal()">Done</button></div>
      </div>
    </div>`),
};

// "It worked" does not deserve a dialog you have to dismiss.
let toastT = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), 2200);
}

// ---- money: whole rupees only, everywhere ----
// Splits an integer amount into n integer parts that sum back to it exactly.
// The leftover rupees rotate by seed so the same person is not always the one
// carrying the extra rupee.
function splitEqual(amount, n, seed){
  const base=Math.floor(amount/n), rem=amount-base*n;
  const out=new Array(n).fill(base);
  for(let i=0;i<rem;i++) out[(seed+i)%n]++;
  return out;
}

// ---- planning projection (informational, never in a balance) ----
function legCost(km,eff,rate){ return num(eff)>0 ? Math.round(num(km)/num(eff)*num(rate)) : 0; }
// The buffer rides on the petrol leg — local running happens up in the hills,
// and it is the dearer of the two rates, so it is the cautious place to put it.
function petKmTotal(){ const p=state.plan; return num(p.petKm)+num(p.buffer); }
function planFuel(){
  const p=state.plan;
  return legCost(p.cngKm,p.cngEff,p.cngRate) + legCost(petKmTotal(),p.petEff,p.petRate);
}
function planCar(){ const p=state.plan; return num(p.rate)*num(p.days); }
function planTotal(){ return planCar()+planFuel()+num(state.plan.toll); }

// ---- the real ledger ----
// Everything anyone pays is split equally across all five. Who paid it decides
// who is owed. Nothing is weighted, nothing is excluded.
function calc(){
  const paid   = Object.fromEntries(FRIENDS.map(f=>[f,0]));
  const share  = Object.fromEntries(FRIENDS.map(f=>[f,0]));
  // debt[a][b] = rupees a still owes b
  const debt = Object.fromEntries(FRIENDS.map(a=>[a,Object.fromEntries(FRIENDS.map(b=>[b,0]))]));
  // why[a][b][cat] = how much of that is which kind of spending
  const why  = Object.fromEntries(FRIENDS.map(a=>[a,Object.fromEntries(FRIENDS.map(b=>[b,{}]))]));
  let total=0;

  for(const e of state.expenses){
    const sh = sharesOf(e), pb = paidOf(e);
    total += amtOf(e);

    const payers = Object.entries(pb)
      .map(([p,v]) => [p, Math.round(num(v))])
      .filter(([,v]) => v > 0);
    const putIn = payers.reduce((s,[,v]) => s+v, 0);
    for(const [p,v] of payers) paid[p] += v;

    for(const f of FRIENDS){
      const part = Math.round(num(sh[f]));
      share[f] += part;
      if(part <= 0 || !putIn) continue;
      // What f owes goes to each payer in proportion to what that payer put
      // in. The last one takes the rounding remainder so it still adds up.
      let done = 0;
      payers.forEach(([p,v], i) => {
        const cut = i === payers.length-1 ? part - done : Math.round(part * v / putIn);
        done += cut;
        if(p !== f && cut > 0){
          debt[f][p] += cut;
          why[f][p][e.cat] = (why[f][p][e.cat] || 0) + cut;
        }
      });
    }
  }

  // cash already handed over cancels debt in that direction
  for(const p of state.paybacks) debt[p.from][p.to]-=Math.round(p.amount);

  // net every pair down to one direction
  const transfers=[];
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const a=FRIENDS[i], b=FRIENDS[j];
    const n=debt[a][b]-debt[b][a];
    if(n>0)      transfers.push({from:a, to:b, amount:n,  why:why[a][b]});
    else if(n<0) transfers.push({from:b, to:a, amount:-n, why:why[b][a]});
  }
  transfers.sort((x,y)=>y.amount-x.amount);

  // net position: positive = owed money back, negative = still owes
  const net=Object.fromEntries(FRIENDS.map(f=>[f,paid[f]-share[f]]));
  for(const p of state.paybacks){ net[p.from]+=Math.round(p.amount); net[p.to]-=Math.round(p.amount); }

  return {paid,share,net,debt,transfers,total};
}

// Splitting equally is rarely all five - two people share a room, three share
// a cab. Tapping a face drops them out of this bill; the total then divides
// between whoever is left.
function toggleWho(f){
  const on = state.who.includes(f);
  if(on && state.who.length === 1) return;      // somebody has to be paying
  state.who = on ? state.who.filter(x => x !== f) : [...state.who, f];

}
const whoIn = () => FRIENDS.filter(f => state.who.includes(f));

// Says who is in and, once there is an amount, what that works out to each -
// which is the number people are actually checking.
function shareSummary(){
  const on = whoIn(), amt = Math.round(parseFloat(state.amt));
  const who = on.length === FRIENDS.length ? "Everyone"
            : on.length === 1              ? "Only " + on[0]
            :                                on.join(", ");
  if(!amt || amt <= 0) return who + " · tap a face to leave someone out";
  // "each" only means something when there is more than one of them
  return who + " · " + rupee(Math.round(amt / on.length)) + (on.length > 1 ? " each" : "");
}

function updateShareLine(){

}
function togglePayer(f){
  const on = state.payers.includes(f);

  state.payers = on ? state.payers.filter(x => x !== f)
                    : [...state.payers, f];

const payersIn = () => FRIENDS.filter(f => state.payers.includes(f));

// One payer covers the whole bill; several have to say who put in what.
function paidMap(total){
  const on = payersIn();
  if(on.length === 1) return { [on[0]]: total };
  return Object.fromEntries(on.map(f => [f, Math.round(num(state.paid[f]))]));
}
// What is still unspoken for. Rewritten in place so the keyboard stays up.
function draftNote(){

  if(!bill || bill <= 0) return "put the bill total in above and this checks itself";
  const left = bill - draftTotal();
  return left === 0 ? "that matches the bill exactly"
       : left  >  0 ? rupee(left) + " of the bill is still unaccounted for"
       :              rupee(-left) + " more than the bill";
}
function updateDraftTotal(){
  const t = document.getElementById("draftTotal"), n = document.getElementById("draftNote");
  if(t) t.textContent = rupee(draftTotal());

// Load an existing row back into the form rather than making people delete
// and retype it - which also used to move the bill to today's date.
function editExpense(id){
  const e = state.expenses.find(x => String(x.id) === String(id));
  if(!e) return;
  const sh = sharesOf(e);
  setTab("log");
  state.editing = String(e.id);
  state.cat   = e.cat;
  state.desc  = e.desc || "";
  const pb = paidOf(e);
  state.payers = FRIENDS.filter(f => Math.round(num(pb[f])) > 0);
  if(!state.payers.length) state.payers = [e.payer];
  state.payer  = state.payers[0];
  state.paid   = Object.fromEntries(state.payers.map(f => [f, String(Math.round(num(pb[f])) || "")]));
  state.mode  = e.mode || "equal";
  state.amt   = e.mode === "each" ? "" : String(amtOf(e));
  state.draft = e.mode === "each"
    ? Object.fromEntries(FRIENDS.map(f => [f, String(Math.round(num(sh[f])) || "")]))
    : {};
  const had = FRIENDS.filter(f => Math.round(num(sh[f])) > 0);
  state.who = had.length ? had : [...FRIENDS];
  render();
  scrollTo({top:0, behavior:"smooth"});
  toast("Editing " + (e.desc || "this payment"));
}

function cancelEdit(){
  state.editing = null; state.desc = ""; state.amt = ""; state.draft = {};
  state.who = [...FRIENDS]; state.payers = [FRIENDS[0]]; state.paid = {};
  render();
  toast("Edit cancelled");
}

async function addExpense(){
  const desc=state.desc.trim();
  if(!desc){ await ui.alert("Needs a label", "Type what the payment was for."); return; }
  const shares={};
  if(state.mode==="equal"){
    const amt=Math.round(parseFloat(state.amt));
    if(!amt||amt<=0){ await ui.alert("Needs an amount", "Put in what the bill came to."); return; }
    const inOn = whoIn();
    if(!inOn.length){ await ui.alert("Nobody selected", "Pick at least one person to split this between."); return; }
    FRIENDS.forEach(f => shares[f] = 0);
    splitEqual(amt, inOn.length, state.expenses.length).forEach((v,i)=>shares[inOn[i]]=v);
  }else{
    for(const f of FRIENDS) shares[f]=Math.round(num(state.draft[f]));
    if(FRIENDS.some(f=>shares[f]<0)){ await ui.alert("Amounts can't be negative"); return; }
    const sum = FRIENDS.reduce((s,f)=>s+shares[f],0);
    if(sum<=0){ await ui.alert("Nothing to add", "Put in at least one person's amount."); return; }
    const bill = Math.round(parseFloat(state.amt));
    if(bill > 0 && bill !== sum){
      const ok = await ui.confirm("The parts do not add up to the bill", {
        body: "You put the bill at " + rupee(bill) + ", but the parts come to " + rupee(sum)
            + ". Saving will use " + rupee(sum) + ".",
        ok: "Save anyway",
      });
      if(!ok) return;
    }
  }
  const total = FRIENDS.reduce((a,f) => a + Math.round(num(shares[f])), 0);

  if(canEdit() && payersIn().length > 1){
    const put = paidTotal();
    if(put !== total){
      const ok = await ui.confirm("What they put in does not match the bill", {
        body: "The bill comes to " + rupee(total) + ", but the payers add up to "
            + rupee(put) + ". Fix the amounts, or save and the balances will be off.",
        ok: "Save anyway",
      });
      if(!ok) return;
    }
  }

  const editing = state.editing;
  const now = Date.now();
  // whoever put in the most is kept in payer, so anything reading that alone
  // still names the right person
  const paidBy = canEdit() ? paidMap(total) : { [whoAmI()]: total };
  const main = Object.entries(paidBy).sort((a,b) => num(b[1]) - num(a[1]))[0][0];
  const row = {id: editing || String(now), ts: now, cat:state.cat, desc,
               payer: main, paidBy, mode:state.mode, shares};
  if(await push(editing ? "edit_expense" : "add_expense", row)){
    state.draft={}; state.desc=""; state.amt=""; state.editing=null;
    state.who=[...FRIENDS]; state.payers=[FRIENDS[0]]; state.paid={};
    toast(editing ? "Saved changes" : "Added " + desc);
    render();
  }
}

// ---- live location ----
// Starts on its own as soon as the app opens, so nobody has to remember to
// switch it on. The browser still asks each person for permission the first
// time - that prompt cannot be skipped, and should not be. Turning it off
// deletes the row on the server, so it is a real stop, not just a local flag.
// Two different names for the same person: locations are stored under the
// name they typed, the ledger is keyed by the fixed friend list.
const myName = () => canEdit() ? OWNER : (state.me || "");
const whoAmI = () => canEdit() ? OWNER : (state.meFriend || "");

function startShare(silent){
  if(!silent) ls(SHK, "");
  if(state.geoWatch !== null) return;
  if(!navigator.geolocation){ if(!silent) ui.alert("This phone cannot share location"); return; }
  state.geoWatch = navigator.geolocation.watchPosition(
    async pos => {
      state.sharing = true;
      const {latitude:lat, longitude:lng} = pos.coords;
      if(pos.coords.heading != null && !isNaN(pos.coords.heading) && pos.coords.speed > 0.5){
        heading = pos.coords.heading;   // only trust it while actually moving
      }
      try{
        await rpc("share_location", {p_token:KEY, p_name:myName(), p_lat:lat, p_lng:lng});
        // Show our own pin straight away rather than waiting for the next poll.
        state.locations = [...state.locations.filter(p=>p.name!==myName()),
                           {name:myName(), lat, lng, updatedAt:Date.now()}];
      }catch(e){}
      paintLive();
      navTick(lat, lng);
    },
    err => {
      state.sharing = false;
      if(state.geoWatch!==null){ navigator.geolocation.clearWatch(state.geoWatch); state.geoWatch=null; }
      // On auto-start a refusal is just an answer, not an error worth a popup.
      if(!silent) ui.alert(err.code===1 ? "Location permission was refused" : "Could not get your location",
        err.code===1 ? "Allow it in your browser settings to show up on the map." : "");
      paintLive();
    },
    { enableHighAccuracy:true, maximumAge:1000, timeout:20000 }
  );
}

async function stopShare(){
  ls(SHK, "1");   // remembered, so auto-start does not immediately undo it
  if(state.geoWatch!==null){ navigator.geolocation.clearWatch(state.geoWatch); state.geoWatch=null; }
  state.sharing = false;
  try{ await rpc("stop_location", {p_token:KEY, p_name:myName()}); }catch(e){}
  await refreshQuiet();
  paintLive();
}

function dayKey(ts){ return new Date(ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
// A settled payment needs the day and the time, not just the day.
const when = ts => new Date(ts).toLocaleString("en-IN",
  {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});

// WhatsApp uses a proportional font, so padded columns never line up. Every
// line here stands on its own instead, with the headings carrying the shape.
function whatsappText(){
  const t=calc();
  const rule="\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n";
  const why=x=>Object.entries(x.why).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([k])=>CATS[k].toLowerCase()).join(", ");

  let s="\ud83e\uddfe *TRIP SPLIT*\n"+TRIP+"\n";
  if(t.total===0) return s+"\nNothing logged yet.";

  s+=rule+"\ud83d\udcb8 *WHO PAYS WHOM*\n";
  if(t.transfers.length===0){
    s+="\n\u2705 No one has to pay anyone.\n";
  }else{
    // One line each. The category rides on the same line rather than its own.
    for(const f of FRIENDS) for(const x of t.transfers.filter(x=>x.from===f)){
      const w=why(x);
      s+="\n\u2022 *"+f+"* \u2192 *"+x.to+"*  *"+rupee(x.amount)+"*"+(w?"  _"+w+"_":"");
    }
    s+="\n";
    const square=FRIENDS.filter(f=>!t.transfers.some(x=>x.from===f));
    if(square.length) s+="\n\u2705 Nothing to pay: "+square.join(", ")+"\n";

    // Only the people actually owed money need their id in the message.
    const owed=[...new Set(t.transfers.map(x=>x.to))].filter(n=>(state.upi||{})[n]);
    if(owed.length){
      s+=rule+"\ud83d\udcf2 *PAY THEM AT*\n";
      for(const n of owed) s+="\n"+n+" \u2014 `"+state.upi[n]+"`";
      s+="\n";
    }
  }

  s+=rule+"\ud83d\udcca *EVERYONE'S NUMBERS*\n";
  for(const f of FRIENDS){
    const bal=t.net[f];
    s+="\n"+(bal>0?"\ud83d\udfe2":bal<0?"\ud83d\udd34":"\u26aa")+" *"+f+"* "
      +(bal>0?"gets *"+rupee(bal)+"* back":bal<0?"pays *"+rupee(-bal)+"*":"is settled")
      +"  _(spent "+rupee(t.paid[f])+", used "+rupee(t.share[f])+")_";
  }
  s+="\n";

  if(state.paybacks.length){
    s+=rule+"\ud83e\udd1d *ALREADY PAID BACK*\n";
    for(const p of state.paybacks) s+="\n\u2022 "+p.from+" \u2192 "+p.to+"  "+rupee(p.amount);
    s+="\n";
  }

  return s+rule+"\ud83d\udcb0 Total spent: *"+rupee(t.total)+"*";
}

// The bar showed the group's total to everyone, which is the one number that
// is nobody's in particular. It leads with your own position now, and keeps
// the group total beside it as the smaller fact.
function updateStatus(t){
  const el = document.getElementById("status"), note = document.getElementById("statusnote");
  const due = t.transfers.reduce((s,x)=>s+x.amount,0);
  const me = whoAmI();
  const known = FRIENDS.includes(me);
  const owe = known ? t.transfers.filter(x => x.from === me).reduce((s,x)=>s+x.amount, 0) : 0;
  const get = known ? t.transfers.filter(x => x.to   === me).reduce((s,x)=>s+x.amount, 0) : 0;

  let cls = "status", main;
  if(t.total === 0){       cls += " idle"; main = "Nothing logged yet"; }
  else if(!known){                         main = rupee(due) + " still to settle"; }
  else if(owe > 0){                        main = "You pay " + rupee(owe); }
  else if(get > 0){        cls += " ok";   main = "You get " + rupee(get); }
  else {                   cls += " ok";   main = "You are settled up"; }

  el.className = cls;
  el.textContent = main;
  const mini = document.getElementById("ministatus");
  mini.className = cls;
  mini.textContent = main;
  document.getElementById("mininame").textContent = canEdit() ? OWNER : (state.me || "");
  note.textContent = (t.total > 0 && known)
    ? (due > 0 ? rupee(due) + " left across everyone" : "everyone is square")
    : "";
}

function viewLog(t){

// What this particular person has to do about it. Everyone sees the whole
// table below; this is the part that is theirs to act on.
function viewMine(t){
  const me = whoAmI();
  if(!FRIENDS.includes(me)) return "";
  const owe = t.transfers.filter(x => x.from === me);
  const get = t.transfers.filter(x => x.to === me);
  if(!owe.length && !get.length) return `
  <section>
    <div class="shead"><div class="kicker">You</div></div>
    <div class="empty">You are all settled up.</div>
  </section>`;

  return `
  <section>
    <div class="shead"><div class="kicker">You</div></div>
    ${owe.length ? `
      <div class="hint" style="margin:-8px 0 10px">You have to pay ${rupee(owe.reduce((s,x)=>s+x.amount,0))}. They confirm it once it lands.</div>
      ${owe.map(x=>{

        return `<div class="row">

// A straight line between stops would cut across the mountains, so ask OSRM
// once for the real driving geometry. It never changes, so it is cached
// forever; if the fetch fails the straight line is still drawn.
let roadPts = null, roadTried = false;
try{ roadPts = JSON.parse(ls(RK) || "null"); }catch(e){}

async function loadRoadLine(){
  if(roadTried || roadPts) return;
  roadTried = true;
  try{
    const pts = STOPS.filter(x=>x.kind==="stop").map(x=>x.lng+","+x.lat).join(";");
    const r = await fetch("https://router.project-osrm.org/route/v1/driving/"+pts+"?overview=full&geometries=geojson");
    const j = await r.json();
    roadPts = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    ls(RK, JSON.stringify(roadPts));
    if(state.tab==="route") mountMap();
  }catch(e){}
}

         att:"&copy; OpenStreetMap" },
  dark:{ name:"Night", url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
         att:"&copy; OpenStreetMap, &copy; CARTO" },
  sat: { name:"Satellite",
         url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
         att:"Esri, Maxar, Earthstar Geographics" },
};
function mapStyle(){ const v = ls(MSK); return TILES[v] ? v : "map"; }
function setMapStyle(k){ ls(MSK, k); mountMap(); render(); }

// Redraw only the parts that change. Never re-runs mountMap, so no flicker.
function paintLive(){
  if(state.tab !== "route") return;
  const el = document.getElementById("livelist");
  if(el) el.innerHTML = liveListHTML();
  paintPeople();
}

// ---- turn by turn ----
// Runs only while the app is open with the screen on. A web page cannot
// navigate in the background the way a native app does, so the Maps handoff
// stays for the driver; this is for following along inside the app.
let nav = null;          // {dest, steps, line, idx, said, layer, meMark, total}
const R = 6371000;
function metres(a, b){
  const p = Math.PI/180, dLat = (b[0]-a[0])*p, dLng = (b[1]-a[1])*p;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const far = m => m < 950 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1)+" km";
// Round to minutes first, then split - otherwise 7170s prints "1 hr 60 min".
const mins = sec => {
  const m = Math.round(sec/60);
  if(m < 60) return m+" min";
  const h = Math.floor(m/60), r = m%60;
  return r ? h+" hr "+r+" min" : h+" hr";
};

function say(text){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-IN"; u.rate = 0.98;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// One glyph per kind of turn, drawn in a 24x24 box. Left variants are the
// right ones mirrored, so there is half as much path data to get wrong.
const GLYPH = {
  straight: "M12 22V5 M7 10l5-5 5 5",
  right:    "M9 22v-8a4 4 0 0 1 4-4h4 M13 6l4 4-4 4",
  slight:   "M9 22v-7a6 6 0 0 1 1.8-4.3L15 7 M10 6h6v6",
  sharp:    "M9 22v-7a4 4 0 0 1 6.6-3L17 13 M12 15h6V9",
  uturn:    "M7 22V12a5 5 0 0 1 10 0v4 M13 12l4 4 4-4",
  round:    "M12 22v-6 M12 16a4 4 0 1 1 4-4h4 M16 8l4 4-4 4",
  arrive:   "M12 21V4 M12 4h7l-2 3 2 3h-7",
  depart:   "M12 22v-9 M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
};

// Which glyph, and whether to flip it. OSRM says sharp/slight/left/right.
function glyphFor(m){
  const t = m.type, w = m.modifier || "";
  if(t === "arrive")  return ["arrive", false];
  if(t === "depart")  return ["depart", false];
  if(t === "roundabout" || t === "rotary") return ["round", false];
  if(t === "uturn" || w === "uturn")       return ["uturn", false];
  const left = w.includes("left");
  if(w.includes("sharp"))  return ["sharp",  left];
  if(w.includes("slight")) return ["slight", left];
  if(left || w.includes("right")) return ["right", left];
  return ["straight", false];
}

function arrowSVG(m, cls){
  const [g, flip] = glyphFor(m);
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">`
    + `<path d="${GLYPH[g]}"${flip ? ' transform="scale(-1,1) translate(-24,0)"' : ""}/></svg>`;
}

// OSRM's maneuver object turned into something a person would actually say.
function phrase(step){
  const m = step.maneuver, road = step.name ? " onto "+step.name : "";
  const way = m.modifier || "";
  switch(m.type){
    case "depart":     return step.name ? "Head out on "+step.name : "Start driving";
    case "arrive":     return "You have arrived";
    case "turn":       return "Turn "+way+road;
    case "merge":      return "Merge "+way+road;
    case "on ramp":    return "Take the ramp"+road;
    case "off ramp":   return "Take the exit"+road;
    case "fork":       return "Keep "+way+road;
    case "end of road":return "Turn "+way+road;
    case "roundabout":
    case "rotary":     return "At the roundabout take exit "+(m.exit||1)+road;
    case "new name":   return "Continue"+road;
    default:           return way ? "Keep "+way+road : "Continue"+road;
  }
}

function freshFix(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => res(null),
      {enableHighAccuracy:true, maximumAge:3000, timeout:8000});
  });
}

// One OSRM route turned into the shape navTick works with.
function parseRoute(r){
  const line = r.geometry.coordinates.map(c => [c[1], c[0]]);
  // Distance from the start of the line to each of its points, so "how far to
  // the next turn" can follow the road instead of cutting across it.
  const along = [0];
  for(let i=1; i<line.length; i++) along[i] = along[i-1] + metres(line[i-1], line[i]);
  const steps = r.legs[0].steps;
  return {
    line, along, steps,
    // which point on the line each maneuver happens at
    stepAt: steps.map(st => {
      const p = [st.maneuver.location[1], st.maneuver.location[0]];
      let best = 0, bd = Infinity;
      for(let i=0; i<line.length; i++){ const d = metres(p, line[i]); if(d < bd){ bd = d; best = i; } }
      return best;
    }),
    total: r.distance, eta: r.duration,
    // the road that most of this route runs on, to tell the options apart
    via: (steps.map(x => x.name).filter(Boolean)
      .reduce((best, n, _, all) => {
        const c = all.filter(m => m === n).length;
        return c > best.c ? {n, c} : best;
      }, {n:"", c:0})).n,
  };
}

// Road names run long. Trim on a word boundary rather than mid-syllable.
function shortRoad(n){
  if(n.length <= 20) return n;
  const cut = n.slice(0, 20);
  const sp = cut.lastIndexOf(" ");
  return (sp > 8 ? cut.slice(0, sp) : cut) + "…";
}

const pickRoute = k => {
  const r = nav.routes[k];
  return { active:k, line:r.line, along:r.along, steps:r.steps, stepAt:r.stepAt,
           total:r.total, eta:r.eta, idx:0, said:{}, off:0, now:null };
};

// Tapping a faded line, or its chip, makes it the route being followed.
function useRoute(k){
  if(!nav || k === nav.active || !nav.routes[k]) return;
  Object.assign(nav, pickRoute(k));
  mountMap();
  say(phrase(nav.steps[0]));
  if(nav.last) navTick(nav.last[0], nav.last[1]);
  paintNav();
}

async function startNav(i){
  const dest = STOPS[i];
  paintNav({loading:dest.name});
  // Ask the GPS directly; fall back to the last shared position only if it refuses.
  const me = (await freshFix()) || state.locations.find(p => p.name === myName());
  if(!me){
    nav = null; paintNav();
    await ui.alert("Waiting for your location", "Allow location access, then try again.");
    return;
  }

  try{
    const url = "https://router.project-osrm.org/route/v1/driving/"
      + me.lng+","+me.lat+";"+dest.lng+","+dest.lat
      + "?overview=full&geometries=geojson&steps=true&alternatives=2";
    const j = await (await fetch(url)).json();
    if(!j.routes || !j.routes.length) throw new Error("no route");
    nav = {
      dest, routes: j.routes.map(parseRoute), active: 0,
      layer: null, meMark: null, last: [me.lat, me.lng],
    };
    Object.assign(nav, pickRoute(0));
  }catch(e){
    nav = null; paintNav();
    await ui.alert("Could not work out a route", "Try again, or use the Maps link instead.");
    return;
  }

  try{ nav.wake = await navigator.wakeLock.request("screen"); }catch(e){}
  if(state.tab !== "route") setTab("route"); else mountMap();
  say("Starting. "+phrase(nav.steps[0]));
  navTick(me.lat, me.lng);
  paintLive();
}

async function stopNav(){
  if(!nav) return;
  if(window.speechSynthesis) speechSynthesis.cancel();
  try{ if(nav.wake) await nav.wake.release(); }catch(e){}
  cancelAnimationFrame(glideRAF);
  if(nav.layer && lmap) lmap.removeLayer(nav.layer);
  nav = null;
  paintNav();
  if(state.tab === "route") mountMap();
}

// Called on every GPS fix while navigating.
function navTick(lat, lng){
  if(!nav) return;
  const here = [lat, lng];
  nav.last = here;

  // Where are we on the line, and how far off it? One pass gives both.
  let cur = 0, offBy = Infinity;
  for(let i=0; i<nav.line.length; i++){
    const d = metres(here, nav.line[i]);
    if(d < offBy){ offBy = d; cur = i; }
  }

  // The step we are on is the last one whose turn we have already passed.
  // Measured along the road, so a sparse fix at highway speed cannot skip it.
  let idx = 0;
  while(idx < nav.steps.length-1 && nav.stepAt[idx+1] <= cur) idx++;
  if(idx !== nav.idx){ nav.idx = idx; nav.said = {}; }

  const next = nav.steps[Math.min(nav.idx+1, nav.steps.length-1)];
  const d = Math.max(0, nav.along[nav.stepAt[Math.min(nav.idx+1, nav.steps.length-1)]] - nav.along[cur]);

  // Speak once per band, not once per GPS fix.
  const band = d > 800 ? null : d > 300 ? "far" : d > 90 ? "near" : "now";
  if(band && !nav.said[band]){
    nav.said[band] = 1;
    say(band === "now" ? phrase(next) : "In "+far(d)+", "+phrase(next).toLowerCase());
  }

  if(metres(here, [nav.dest.lat, nav.dest.lng]) < 45){
    say("You have arrived at "+nav.dest.name);
    stopNav();
    return;
  }

  // Drifted well off the line for a few fixes running - fetch a fresh route.
  nav.off = offBy > 70 ? nav.off+1 : 0;
  if(nav.off >= 3){ const i = STOPS.indexOf(nav.dest); nav.off = 0; startNav(i); return; }

  const left = Math.max(0, nav.along[nav.line.length-1] - nav.along[cur]);
  const after = nav.steps[nav.idx+2];
  nav.now = {d, text: phrase(next), man: next.maneuver,
             then: after ? phrase(after) : "",
             left, eta: nav.eta * (nav.total ? left/nav.total : 0)};
  if(lmap){
    if(!nav.meMark){
      nav.meMark = L.marker(here, {icon: meIcon(), zIndexOffset:900}).addTo(lmap);
      lmap.setView(here, Math.max(lmap.getZoom(), 16));
    }else{
      nav.meMark.setIcon(meIcon());
      if(following) glideTo(here); else nav.meMark.setLatLng(here);
    }
  }
  paintNav();
}

// Slide the marker and the map from where they are to the new fix over about
// a second, which is roughly how often a fix arrives - so the dot moves with
// the car rather than teleporting once a second.
let glideRAF = null;
function glideTo(to){
  if(!nav || !nav.meMark || !lmap) return;
  const from = nav.meMark.getLatLng();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    nav.meMark.setLatLng(to); lmap.panTo(to, {animate:false}); return;
  }
  const t0 = performance.now(), dur = 950;
  cancelAnimationFrame(glideRAF);
  lmap.panTo(to, {animate:true, duration:0.95, easeLinearity:0.6, noMoveStart:true});
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    const e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;   // ease in out
    nav.meMark.setLatLng([from.lat + (to[0]-from.lat)*e, from.lng + (to[1]-from.lng)*e]);
    if(t < 1) glideRAF = requestAnimationFrame(step);
  };
  glideRAF = requestAnimationFrame(step);
}

// The dot points where you are going when the GPS reports a heading.
function meIcon(){
  const rot = heading == null ? "" : ` style="transform:rotate(${Math.round(heading)}deg)"`;
  const shape = heading == null
    ? `<circle cx="13" cy="13" r="7" fill="#1a73e8" stroke="#fff" stroke-width="3"/>`
    : `<path d="M13 3l7 18-7-4-7 4z" fill="#1a73e8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
  return L.divIcon({ className:"", iconSize:[0,0],
    html:`<div class="mearrow"${rot}><svg viewBox="0 0 26 26">${shape}</svg></div>` });
}

function recentre(){
  following = true;
  const me = state.locations.find(p => p.name === myName());
  const to = nav && nav.meMark ? nav.meMark.getLatLng() : (me ? [me.lat, me.lng] : null);
  if(to && lmap) lmap.setView(to, Math.max(lmap.getZoom(), 16), {animate:true});
  paintMapBar();
}

function paintMapBar(){
  const el = document.getElementById("mapbar");
  if(el) el.innerHTML = mapBarHTML();
}

function mapBarHTML(){
  const cur = mapStyle();
  return Object.keys(TILES).map(k =>
      `<button class="opt ${k===cur?"on":""}" onclick="setMapStyle('${k}')">${TILES[k].name}</button>`
    ).join("")
    + `<button class="opt ${following?"on":""}" onclick="recentre()">Follow me</button>`
    + (heading == null ? "" : `<span class="compass" aria-label="Heading ${Math.round(heading)} degrees">
         <svg viewBox="0 0 24 24" style="transform:rotate(${-Math.round(heading)}deg)" aria-hidden="true">
           <path d="M12 2v20M12 2l-4 6h8z" fill="${BRAND}" stroke="none"/>
           <circle cx="12" cy="12" r="10" fill="none" stroke="var(--edge)" stroke-width="1.5"/>
         </svg>N</span>`);
}

function paintNav(opt){
  const el = document.getElementById("nav");
  if(!el) return;
  if(opt && opt.loading){
    el.innerHTML = `<div class="navbar"><div class="navtop"><div><div class="big">Finding the way to ${esc(opt.loading)}…</div></div></div></div>`;
    return;
  }
  if(!nav){ el.innerHTML = ""; return; }
  const n = nav.now || {d:0, text:phrase(nav.steps[0]), man:nav.steps[0].maneuver,
                        then:"", left:nav.total, eta:nav.eta};
  el.innerHTML = `
    <div class="navbar">
      <div class="navtop">
        ${n.man ? arrowSVG(n.man, "navicon") : ""}
        <div class="dist">${far(n.d)}</div>
        <div>
          <div class="big">${esc(n.text)}</div>
          ${n.then?`<div class="sub">then ${esc(n.then.charAt(0).toLowerCase()+n.then.slice(1))}</div>`:""}
        </div>
      </div>
      <div class="navfoot">
        <span>${esc(nav.dest.name)} · ${far(n.left ?? nav.total)} left · ${mins(n.eta ?? nav.eta)}</span>
        <button onclick="stopNav()">Stop</button>
      </div>
      ${nav.routes.length < 2 ? "" : `<div class="navalt">
        ${nav.routes.map((r,k)=>{
          const slower = Math.round((r.eta - nav.routes[0].eta)/60);
          return `<button class="${k===nav.active?"on":""}" onclick="useRoute(${k})">
            ${k===0 ? "Fastest" : (r.via ? esc(shortRoad(r.via)) : "Other way")}
            · ${mins(r.eta)}${k>0 && slower>0 ? " (+"+slower+" min)" : ""}
          </button>`;
        }).join("")}
      </div>`}
    </div>`;
}

function fitMap(){
  if(!lmap) return;
  lview = null;   // forget the remembered view, we are deliberately resetting it
  const big = STOPS.filter(x=>x.kind==="stop").map(x=>[x.lat, x.lng]);
  lmap.fitBounds(L.latLngBounds([...(roadPts || big), ...state.locations.map(p=>[p.lat, p.lng])]), {padding:[26,26]});
}

// Tapping a person moves this map, instead of throwing them out to Google.
function showOnMap(name){
  const p = state.locations.find(x => x.name === name);
  if(!p || !lmap) return;
  lmap.flyTo([p.lat, p.lng], 14, {duration:.7});
  if(pins[name]) pins[name].openPopup();
  const el = document.getElementById("map");
  if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
}
function mountMap(){
  const el = document.getElementById("map");
  if(!el || typeof L === "undefined") return;
  if(lmap){ lview = {c:lmap.getCenter(), z:lmap.getZoom()}; lmap.remove(); lmap = null; }

  // Extra renderer padding: vectors are drawn well past the visible edge, so
  // panning never reveals an unpainted part of the route.
  lmap = L.map(el, {renderer:L.svg({padding:1})});
  lmap.attributionControl.setPrefix("");
  const t = TILES[mapStyle()];
  L.tileLayer(t.url, {maxZoom:19, attribution:t.att}).addTo(lmap);
  // Dragging by hand means you want to look somewhere else, so stop chasing.
  lmap.on("dragstart", () => { following = false; paintMapBar(); });

  const big = STOPS.filter(x=>x.kind==="stop").map(x=>[x.lat, x.lng]);
  L.polyline(roadPts || big, {color:BRAND, weight:4, opacity:.8}).addTo(lmap);
  loadRoadLine();

  for(const st of STOPS){
    L.circleMarker([st.lat, st.lng], {
      radius: st.kind==="stop" ? 7 : 5, color:"#fff", weight:2,
      fillColor: st.kind==="stop" ? BRAND : "#64748b", fillOpacity:1,
    }).addTo(lmap).bindPopup("<b>"+esc(st.name)+"</b><br>"+esc(st.note));
  }

  // People sit on their own layer: a refresh swaps the dots without touching
  // the tiles or the route, which is what made the whole map blink.
  peopleLayer = L.layerGroup().addTo(lmap);
  paintPeople();

  if(nav){
    nav.layer = L.layerGroup().addTo(lmap);
    // Alternatives first and faded, so the one being followed sits on top.
    nav.routes.forEach((r, k) => {
      if(k === nav.active) return;
      L.polyline(r.line, {color:"#94a3b8", weight:5, opacity:.9}).addTo(nav.layer);
      // a fat invisible line makes it tappable with a thumb
      L.polyline(r.line, {color:"#000", weight:22, opacity:0, interactive:true})
        .addTo(nav.layer).on("click", () => useRoute(k));
    });
    L.polyline(nav.line, {color:"#1a73e8", weight:6, opacity:.9}).addTo(nav.layer);
    nav.meMark = null;
  }

  if(lview) lmap.setView(lview.c, lview.z);
  else lmap.fitBounds(L.latLngBounds([...big, ...state.locations.map(p=>[p.lat, p.lng])]), {padding:[26,26]});
}

const mapsNavTo = st => "https://www.google.com/maps/dir/?api=1&destination="+st.lat+","+st.lng+"&travelmode=driving";
// One link for the whole loop: start, every major stop as a waypoint, end.
function mapsFullRoute(){
  const big = STOPS.filter(x=>x.kind==="stop");
  const pt  = x => x.lat+","+x.lng;
  return "https://www.google.com/maps/dir/?api=1"
    + "&origin="      + pt(big[0])
    + "&destination=" + pt(big[big.length-1])
    + "&waypoints="   + big.slice(1,-1).map(pt).join("|")
    + "&travelmode=driving";
}

      <span><i style="background:#64748b"></i>Places to see</span>
      <span><i style="background:${LIVE}"></i>People, live</span>
      ${nav?`<span><i style="background:#1a73e8"></i>Your route</span>
             <span><i style="background:#94a3b8"></i>Other way — tap it to switch</span>`:""}

function liveListHTML(){
  const live = [...state.locations].sort((a,b)=>b.updatedAt-a.updatedAt);
  const me   = myName();
  return `
    ${!me ? ""
      : state.sharing
        ? `<div class="live"><span class="pulse"></span>Yours is on · only this group sees it
             <button class="x" style="margin-left:4px" onclick="stopShare()">turn off</button></div>`
        : `<div class="live">Yours is off
             <button class="x" style="margin-left:4px" onclick="startShare()">turn on</button></div>`}
    ${live.length===0
      ? `<div class="empty">Nobody is sharing right now.</div>`
      : live.map(p=>`
        <div class="row">
          <div class="ini">${initials(p.name)}</div>
          <div class="body">
            <div class="t">${esc(p.name)}${p.name===me?" (you)":""}</div>
            <div class="s">${ago(p.updatedAt)}</div>
          </div>
          <button class="go" onclick="showOnMap(${jq(p.name)})">Show</button>
        </div>`).join("")}`;
}

function gateHTML(){
  if(!state.gate) return null;
  if(state.gate==="loading") return `<section><div class="empty">Opening…</div></section>`;
  if(state.gate==="join") return `
  <section>
    <div class="shead"><div class="kicker">You have been invited</div></div>
    <label class="lbl" for="j-name">Your name</label>
    <input class="f" id="j-name" autocomplete="name" placeholder="Type your name">
    ${state.gateMsg?`<div class="hint" style="margin-top:9px;color:var(--neg)">${esc(state.gateMsg)}</div>`:""}
    <button class="btn" onclick="doJoin()">Join</button>
  </section>`;
  return `
  <section>
    <div class="shead"><div class="kicker">Invite only</div></div>
    <div class="hint" style="margin:-8px 0 0">${esc(state.gateMsg || ("Ask "+OWNER+" for your invite link."))}</div>
  </section>`;
}

const SHOTS = { log:"bg-log.jpg", settle:"bg-split.jpg", route:"bg-route.jpg", trip:"bg-trip.jpg" };
// Fade the old one out, swap, fade back in - a hard cut between two photos
// reads as a glitch.
function setShot(tab){
  const el = document.getElementById("shot"), url = SHOTS[tab];
  if(!el || !url || el.dataset.url === url) return;
  el.dataset.url = url;
  el.style.opacity = "0";
  setTimeout(() => {
    el.style.backgroundImage = `url("${url}")`;
    el.style.opacity = "";
  }, el.style.backgroundImage ? 240 : 0);
}

function render(){
  document.getElementById("trip").textContent=TRIP_SHORT;
  setShot(state.tab);
  const gate=gateHTML();
  const nav=document.querySelector("nav"), st=document.getElementById("status");
  const rl=document.getElementById("role"), ft=document.getElementById("foot");

  if(gate){
    nav.style.display="none"; st.style.display="none";
    rl.textContent=""; ft.textContent="";
    document.getElementById("install").innerHTML="";
    document.getElementById("view").innerHTML=gate;
    return;
  }
  nav.style.display=""; st.style.display="";

  const t=calc();
  updateStatus(t);
  rl.innerHTML = `<b>${esc(canEdit() ? OWNER : (state.me||"Guest"))}</b>`;
  ft.textContent = "";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===state.tab));
  document.getElementById("view").innerHTML =
    state.tab==="log"   ? viewLog(t)
  : state.tab==="trip"  ? viewTrip(t)
  : state.tab==="route" ? viewRoute()
  : viewSettle(t);

  if(state.tab==="route") mountMap();
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

// Show the compact bar once the real header has scrolled away. It is fixed, so
// this changes no layout and therefore cannot feed back into scrollY - the
// thing that made the old collapsing header flicker.
addEventListener("scroll", () => {
  const on = scrollY > 128;
  const el = document.getElementById("minibar");
  if(on !== el.classList.contains("on")) el.classList.toggle("on", on);
}, {passive:true});

// ---- add to home screen ----
let deferredPrompt=null;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){
  const slot=document.getElementById("install");
  // Already on the home screen, or told once that it is — then stop offering.
  // Android fires no event when the browser menu was used instead of the
  // button, so "already done" is the only thing that reliably clears it.
  if(isStandalone || ls(IK) || (!deferredPrompt && !isIOS)){ slot.innerHTML=""; return; }
  slot.innerHTML=`<section>
    <div class="shead">
      <div class="kicker">Install</div>
      <button class="link" onclick="ls(IK,'1');renderInstall()">Already done</button>
    </div>
    ${deferredPrompt
      ? `<button class="btn" onclick="doInstall()">Add to home screen</button>`
      : `<div class="hint">Safari → Share → <b>Add to Home Screen</b>.</div>`}
  </section>`;
}
function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; renderInstall(); });
}
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
addEventListener("appinstalled",()=>{ deferredPrompt=null; ls(IK,"1"); renderInstall(); });

if("serviceWorker" in navigator){
  // Network first: online you always get the current build, offline you get the
  // last one that loaded. The old cache-first worker could never update itself.
  const sw="const C='tripsplit-v5';"
    +"self.addEventListener('install',e=>self.skipWaiting());"
    +"self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));"
    +"self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;"
    +"e.respondWith(fetch(e.request).then(res=>{const c=res.clone();caches.open(C).then(k=>k.put(e.request,c).catch(()=>{}));return res;}).catch(()=>caches.match(e.request)));});";
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}

async function boot(){
  const q = new URLSearchParams(location.search);
  const owner = q.get("owner"), join = q.get("join");
  if(owner || join) history.replaceState(null, "", location.pathname);  // keep tokens out of the address bar

  if(owner){ KEY = owner; ls(KK, owner); }
  else KEY = ls(KK) || null;

  try{ localStorage.removeItem("tripsplit5:queue"); }catch(e){}   // drop any old queue
  const lastTab = ls(TK);
  if(["log","settle","route","trip"].includes(lastTab)) state.tab = lastTab;

  // Put the last known ledger on screen at once, then go and get the real one.
  try{
    const c = JSON.parse(ls(CK) || "null");
    if(c && KEY) applyLedger(c, false);
  }catch(e){}
  render();

  // An invite link always asks for a name — unless it is the same link this
  // browser already used, in which case there is nothing left to ask.
  if(join && !(KEY && ls(JK) === join)){
    state.joinToken = join; state.gate = "join"; state.gateMsg = "";
    render();
    return;
  }
  if(!KEY){ state.gate = "noinvite"; render(); return; }

  try{
    await refresh();
    if(canEdit()) dropLegacy();
    if(!ls(SHK)) startShare(true);
  }catch(e){
    // No signal. Keep showing the cached copy if there is one; say so if not.
    if(!state.expenses.length && !state.paybacks.length){
      state.gate = "badkey";
      state.gateMsg = "No signal, and nothing saved on this phone yet. Try again once you are back online.";
    }
  }
  if(state.tab === "route") setTab("route");   // starts the poll and builds the map
  render();
  renderInstall();
}

boot();
</script>
