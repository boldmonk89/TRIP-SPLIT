<title>Trip Split</title>
<style>
  :root{
    --bg:#f7f7f7; --card:#fff; --ink:#222222; --dim:#717171; --faint:#b0b0b0;
    --line:#ebebeb; --edge:#dddddd; --brand:#ff385c; --pos:#008a05; --neg:#c13515;
    --sh:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  input,select{font-family:inherit;color:inherit}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .wrap{max-width:540px;margin:0 auto;padding:0 16px}
  .n{font-variant-numeric:tabular-nums}

  /* header */
  header{background:var(--card);padding:22px 0 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.035em}
  .trip{font-size:14px;color:var(--dim);margin-top:1px}
  .status{margin-top:15px;display:inline-flex;align-items:center;gap:7px;border-radius:100px;
    padding:8px 15px;font-size:13.5px;font-weight:600;background:#fff0f3;color:var(--brand)}
  .status.ok{background:#eef7ee;color:var(--pos)}
  .status.idle{background:var(--bg);color:var(--dim)}

  /* bottom tab bar */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--dim);letter-spacing:.01em}
  nav button.on{color:var(--brand)}
  nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  /* cards */
  main{padding-top:16px}
  section{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
  .shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .kicker{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .hint{font-size:13.5px;color:var(--dim);line-height:1.5}
  .hint b{color:var(--ink);font-weight:600}

  /* fields */
  label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:7px}
  .f{width:100%;font-size:16px;padding:14px 15px;border:1px solid var(--edge);border-radius:12px;background:var(--card)}
  .f:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .f.num{font-variant-numeric:tabular-nums;font-weight:600}
  select.f{-webkit-appearance:none;appearance:none;font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 19px) 24px,calc(100% - 14px) 24px;background-size:5px 5px;background-repeat:no-repeat}
  .money{display:flex;align-items:center;border:1px solid var(--edge);border-radius:12px;background:var(--card);padding-left:14px}
  .money:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .money span{font-size:15px;color:var(--faint);font-weight:600}
  .money input{flex:1;min-width:0;border:0;background:none;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;padding:14px 14px 14px 5px}
  .money input:focus{outline:none}
  .duo{display:flex;gap:10px}
  .duo>*{flex:1;min-width:0}

  /* buttons */
  .btn{width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;padding:15px;
    font-size:16px;font-weight:600;margin-top:20px}
  .btn:active{filter:brightness(.93)}
  .btn.line{background:var(--card);color:var(--ink);border:1px solid var(--ink);font-size:14.5px;padding:12px}
  .link{border:0;background:none;padding:0;font-size:13.5px;font-weight:600;color:var(--ink);
    text-decoration:underline;text-underline-offset:3px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--edge);background:var(--card);border-radius:100px;padding:9px 16px;
    font-size:14px;font-weight:600;color:var(--ink)}
  .opt.on{border-color:var(--ink);background:var(--ink);color:#fff}

  /* rows */
  .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:13px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    text-align:right;flex-shrink:0}
  .tag{font-size:11px;font-weight:600;color:var(--dim);background:var(--bg);border-radius:100px;
    padding:5px 11px;flex-shrink:0}
  .ini{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:600}
  .x{border:0;background:none;padding:3px 0 0;font-size:12.5px;color:var(--dim);
    text-decoration:underline;text-underline-offset:2px}
  .empty{padding:30px 0;font-size:14px;color:var(--dim);text-align:center}
  .daybar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:20px 0 4px;border-top:1px solid var(--line);margin-top:6px}
  .daybar:first-child{border-top:0;padding-top:0;margin-top:0}
  .daybar b{font-size:13px;font-weight:700}
  .daybar span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}

  /* settlement */
  .arrow{color:var(--faint);font-weight:400}
  .settled{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);
    font-size:14px;color:var(--dim)}
  .settled:first-child{border-top:0}
  .settled .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .allsquare{padding:34px 0;text-align:center}
  .allsquare b{display:block;font-size:17px;font-weight:700;margin-bottom:4px}

  /* people */
  .person{border-top:1px solid var(--line)}
  .person:first-child{border-top:0}
  .phead{width:100%;border:0;background:none;padding:16px 0;display:flex;align-items:center;gap:12px;text-align:left}
  .person:first-child .phead{padding-top:0}
  .phead .t{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .phead .s{font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim);margin-top:1px}
  .net{margin-left:auto;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .caret{color:var(--faint);font-size:11px;width:11px;flex-shrink:0}
  .detail{padding:0 0 18px 48px}
  .drow{display:flex;gap:10px;padding:7px 0;font-size:14px}
  .drow .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

  .note{background:var(--bg);border-radius:12px;padding:14px 15px;font-size:13.5px;color:var(--dim);line-height:1.55}
  .note b{color:var(--ink);font-weight:600}
  .warn{background:#fff0f3;color:var(--neg)}
  .warn b{color:var(--neg)}
  footer{padding:4px 0 8px;font-size:12.5px;color:var(--faint);text-align:center}
  .role{margin-top:9px;font-size:12.5px;color:var(--dim)}
  .role b{color:var(--ink);font-weight:600}
  .acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
</style>

<body>

<header>
  <div class="wrap">
    <h1>Trip Split</h1>
    <p class="trip" id="trip"></p>
    <div class="status" id="status"></div>
    <div class="role" id="role"></div>
  </div>
</header>

<main class="wrap">
  <div id="view"></div>
  <div id="install"></div>
  <footer id="foot"></footer>
</main>

<nav>
  <button data-tab="log" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v16l-3-2-3 2-3-2-3 2-2-1V4z"/><path d="M8 9h8M8 13h5"/></svg>
    Log
  </button>
  <button data-tab="settle">
    <svg viewBox="0 0 24 24"><path d="M3 8h14l-3-3M21 16H7l3 3"/></svg>
    Split
  </button>
  <button data-tab="trip">
    <svg viewBox="0 0 24 24"><path d="M5 17H3v-6l2-5h11l2 5v6h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>
    Trip
  </button>
</nav>

<script>
const FRIENDS = ["Archit","Satwik","Kripansh","Tejas","Akshat"];
const OWNER = "Tejas";   // the one holding the owner link; everyone else reads only
const TRIP = "Delhi · Mussoorie · Landour · Dhanaulti · 8–11 Sep";

// ---- the shared ledger ----
// The key below is meant to be public — on its own it can reach nothing. Every
// table has RLS on with no policies and no grants, so the only way in is the
// three functions, and each one asks for a token before it hands anything over.
// The owner secret can write. A member token can only read.
const SB_URL = "https://blqllckizxsisvlnnsgl.supabase.co";
const SB_KEY = "sb_publishable_DXfw_KDpFMgxmmWFvfxgFg_UWzvhJ2r";

async function rpc(fn, args){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(args),
  });
  if(!r.ok) throw new Error("rpc "+fn+" failed: "+r.status);
  return r.json();
}

// The official pool, and only this. Whatever extra cash anyone carries is
// their own business and never appears in any number in this app.
const CAPITAL = { Archit:12000, Satwik:10000, Kripansh:12000, Tejas:12000, Akshat:12000 };

const CATS = { car:"Car", fuel:"Fuel", toll:"Toll", stay:"Stay", food:"Food", activity:"Activity", misc:"Misc" };

// The one genuinely fixed cost. Everything else gets decided on the road and
// logged as it is actually paid.
const CAR_RATE = 3300;
const CAR_DAYS = 3;

// Planning projection only — never touches anyone's balance.
// Delhi (Samaypur Badli) to Mussoorie is 262km by road via NH344G, of which the
// last ~35km is the climb from Dehradun. Mussoorie -> Landour -> Dhanaulti is
// another ~35km of hill road. So each way: 227km of highway, then 70km of hills.
// Landour sits just above Mussoorie, so it rides on the buffer below.
// Mileage is deliberately worst-case — a retrofitted CNG kit on a loaded Creta,
// and petrol on steep sections with five up, luggage and the AC running.
const PLAN = {
  cngKm:454, cngEff:12, cngRate:85,    // 227km each way, Samaypur Badli <-> Dehradun
  petKm:140, petEff:9,  petRate:105,   // 70km each way, Dehradun -> Mussoorie -> Dhanaulti
  buffer:100,                          // local running up there, charged at petrol rates
  toll:1340,                           // Rs670 each way, FASTag only
};

const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = f => f.slice(0,2).toUpperCase();
const num = v => Number(v)||0;
const N = FRIENDS.length;

// ---- state ----
let state = {
  // expense: {id, ts, cat, desc, payer, mode, shares:{name:rupees}}
  // shares is the whole truth — who owes what for this bill. "equal" mode fills
  // it by dividing five ways, "each" mode fills it from what each person's own
  // item actually cost. calc() never needs to know which was used.
  expenses: [],
  paybacks: [],   // {id, ts, from, to, amount} — cash actually handed over
  plan: {...PLAN, rate:CAR_RATE, days:CAR_DAYS},
  tab:"log", cat:"food", payer:FRIENDS[0], openPerson:null, showPlan:false,
  mode:"equal", draft:{},   // draft holds the per-person amounts being typed

  // who is looking: "owner" can change things, "viewer" can only read
  role:null, me:null, members:[],
  gate:"loading",           // null once we have a session; otherwise which screen to show
  gateMsg:"", joinToken:null, showOwnerLink:false,
};
const canEdit = () => state.role === "owner";

// Expenses saved before per-item splitting existed only had a total; treat those
// as an even split so old entries keep working.
const sharesOf = e => e.shares || Object.fromEntries(
  splitEqual(Math.round(num(e.amount)), N, 0).map((v,i)=>[FRIENDS[i],v]));
const amtOf = e => FRIENDS.reduce((s,f)=>s+Math.round(num(sharesOf(e)[f])),0);
const draftTotal = () => FRIENDS.reduce((s,f)=>s+Math.round(num(state.draft[f])),0);

// ---- session ----
// One key in localStorage is the whole login: the owner secret for me, a member
// token for everyone else. The server decides which it is; the app never does.
const KK = "tripsplit5:key", CK = "tripsplit5:cache", JK = "tripsplit5:join",
      MK = "tripsplit5:migrated", IK = "tripsplit5:installed";
let KEY = null;

function ls(k, v){
  try{ return v===undefined ? localStorage.getItem(k) : (localStorage.setItem(k,v), v); }
  catch(e){ return null; }
}

// The last ledger we saw, kept so the app still opens something useful in the
// hills with no signal. It is a cache, never the source of truth.
function applyLedger(d, cache){
  state.role     = d.role;
  state.me       = d.me || null;
  state.expenses = d.expenses || [];
  state.paybacks = d.paybacks || [];
  state.members  = d.members  || [];
  state.plan     = {...PLAN, rate:CAR_RATE, days:CAR_DAYS, ...(d.plan || {})};
  state.gate     = null;
  if(cache !== false) ls(CK, JSON.stringify(d));
}

// Every change goes through here. Nothing is written locally first — if the
// server did not take it, it did not happen, and the form keeps what you typed.
async function push(op, data){
  if(!canEdit()) return false;
  try{
    const res = await rpc("owner_apply", {p_secret:KEY, p_op:op, p_data:data||{}});
    if(res.error){ alert(res.error); return false; }
    applyLedger(res);
    return true;
  }catch(e){
    alert("No signal — that was not saved. Try again once you are back online.");
    return false;
  }finally{
    render();
  }
}

async function refresh(){
  const d = await rpc("get_ledger", {p_token:KEY});
  if(d.role === "none"){
    ls(KK, ""); KEY = null;
    state.gate = "badkey";
    state.gateMsg = "That link no longer works. Ask Tejas for a fresh one.";
    return;
  }
  applyLedger(d);
}

// Whatever was already sitting in this browser from before the app went shared,
// lifted up once so nothing from the trip is lost.
async function migrateLocal(){
  if(ls(MK)) return;
  let old = {e:[], p:[], plan:null};
  try{
    old.e    = JSON.parse(ls("tripsplit4:expenses") || "[]");
    old.p    = JSON.parse(ls("tripsplit4:paybacks") || "[]");
    old.plan = JSON.parse(ls("tripsplit4:plan") || "null");
  }catch(e){}
  const hasOld = old.e.length || old.p.length;
  // Only ever into an empty ledger, so this can never double up on real data.
  if(!hasOld || state.expenses.length || state.paybacks.length){ ls(MK, "1"); return; }
  const payload = {
    expenses: old.e.map(x => ({...x, id:String(x.id), ts:x.ts || x.id, shares:sharesOf(x)})),
    paybacks: old.p.map(x => ({...x, id:String(x.id), ts:x.ts || x.id})),
  };
  if(old.plan) payload.plan = old.plan;
  if(await push("import", payload)) ls(MK, "1");
}

// ---- money: whole rupees only, everywhere ----
// Splits an integer amount into n integer parts that sum back to it exactly.
// The leftover rupees rotate by seed so the same person is not always the one
// carrying the extra rupee.
function splitEqual(amount, n, seed){
  const base=Math.floor(amount/n), rem=amount-base*n;
  const out=new Array(n).fill(base);
  for(let i=0;i<rem;i++) out[(seed+i)%n]++;
  return out;
}

// ---- planning projection (informational, never in a balance) ----
function legCost(km,eff,rate){ return num(eff)>0 ? Math.round(num(km)/num(eff)*num(rate)) : 0; }
// The buffer rides on the petrol leg — local running happens up in the hills,
// and it is the dearer of the two rates, so it is the cautious place to put it.
function petKmTotal(){ const p=state.plan; return num(p.petKm)+num(p.buffer); }
function planFuel(){
  const p=state.plan;
  return legCost(p.cngKm,p.cngEff,p.cngRate) + legCost(petKmTotal(),p.petEff,p.petRate);
}
function planCar(){ const p=state.plan; return num(p.rate)*num(p.days); }
function planTotal(){ return planCar()+planFuel()+num(state.plan.toll); }

// ---- the real ledger ----
// Everything anyone pays is split equally across all five. Who paid it decides
// who is owed. Nothing is weighted, nothing is excluded.
function calc(){
  const paid   = Object.fromEntries(FRIENDS.map(f=>[f,0]));
  const share  = Object.fromEntries(FRIENDS.map(f=>[f,0]));
  // debt[a][b] = rupees a still owes b
  const debt = Object.fromEntries(FRIENDS.map(a=>[a,Object.fromEntries(FRIENDS.map(b=>[b,0]))]));
  // why[a][b][cat] = how much of that is which kind of spending
  const why  = Object.fromEntries(FRIENDS.map(a=>[a,Object.fromEntries(FRIENDS.map(b=>[b,{}]))]));
  let total=0;

  for(const e of state.expenses){
    const sh=sharesOf(e);
    paid[e.payer]+=amtOf(e); total+=amtOf(e);
    for(const f of FRIENDS){
      const part=Math.round(num(sh[f]));
      share[f]+=part;
      if(f!==e.payer && part>0){
        debt[f][e.payer]+=part;
        why[f][e.payer][e.cat]=(why[f][e.payer][e.cat]||0)+part;
      }
    }
  }

  // cash already handed over cancels debt in that direction
  for(const p of state.paybacks) debt[p.from][p.to]-=Math.round(p.amount);

  // net every pair down to one direction
  const transfers=[];
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const a=FRIENDS[i], b=FRIENDS[j];
    const n=debt[a][b]-debt[b][a];
    if(n>0)      transfers.push({from:a, to:b, amount:n,  why:why[a][b]});
    else if(n<0) transfers.push({from:b, to:a, amount:-n, why:why[b][a]});
  }
  transfers.sort((x,y)=>y.amount-x.amount);

  // net position: positive = owed money back, negative = still owes
  const net=Object.fromEntries(FRIENDS.map(f=>[f,paid[f]-share[f]]));
  for(const p of state.paybacks){ net[p.from]+=Math.round(p.amount); net[p.to]-=Math.round(p.amount); }

  // what should physically still be in each pocket — the discrepancy check
  const pocket=Object.fromEntries(FRIENDS.map(f=>[f,CAPITAL[f]-paid[f]]));
  for(const p of state.paybacks){ pocket[p.from]-=Math.round(p.amount); pocket[p.to]+=Math.round(p.amount); }

  return {paid,share,net,debt,transfers,total,pocket};
}

// ---- actions ----
function setTab(t){ state.tab=t; state.openPerson=null; render(); renderInstall(); }
function setCat(k){ state.cat=k; render(); }
function togglePerson(f){ state.openPerson = state.openPerson===f ? null : f; render(); }
function togglePlan(){ state.showPlan=!state.showPlan; render(); }
// Typing only moves the local number and the note under it. The plan is sent
// once, on blur, so a four-digit toll is one write instead of four.
function setPlan(key,v){ if(v!==""&&!isNaN(Number(v))){ state.plan[key]=Number(v); updatePlanNote(); } }
function fixPlan(key,v){ if(v===""||isNaN(Number(v))) state.plan[key]=0; push("set_plan", state.plan); }

function setMode(m){ state.mode=m; render(); }
function setDraft(f,v){
  state.draft[f]=v;
  const el=document.getElementById("draftTotal");
  if(el) el.textContent=rupee(draftTotal());
}

async function addExpense(){
  const desc=document.getElementById("f-desc").value.trim();
  if(!desc){ alert("Needs a label."); return; }
  const shares={};
  if(state.mode==="equal"){
    const amt=Math.round(parseFloat(document.getElementById("f-amt").value));
    if(!amt||amt<=0){ alert("Needs an amount."); return; }
    splitEqual(amt,N,state.expenses.length).forEach((v,i)=>shares[FRIENDS[i]]=v);
  }else{
    for(const f of FRIENDS) shares[f]=Math.round(num(state.draft[f]));
    if(FRIENDS.some(f=>shares[f]<0)){ alert("Amounts can't be negative."); return; }
    if(FRIENDS.reduce((s,f)=>s+shares[f],0)<=0){ alert("Put in at least one person's amount."); return; }
  }
  const now=Date.now();
  if(await push("add_expense", {id:String(now), ts:now, cat:state.cat, desc, payer:state.payer, mode:state.mode, shares})){
    state.draft={};
    render();
  }
}
function delExpense(id){
  if(!confirm("Remove this expense?")) return;
  push("del_expense", {id:String(id)});
}

async function doJoin(){

// ---- share ----
function dayKey(ts){ return new Date(ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }

// WhatsApp uses a proportional font, so padded columns never line up. Every
// line here stands on its own instead, with the headings carrying the shape.
function whatsappText(){
  const t=calc();
  const rule="\n━━━━━━━━━━━━━━━\n";
  const why=x=>Object.entries(x.why).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([k])=>CATS[k].toLowerCase()).join(", ");

  let s="🧾 *TRIP SPLIT*\n"+TRIP+"\n\n";
  s+="Shared things split 5 ways. Food is per person — whatever each of us ordered.\n";
  if(t.total===0) return s+"\nNothing logged yet.";

  s+=rule+"💸 *WHO PAYS WHOM*\n";
  if(t.transfers.length===0){
    s+="\n✅ All square — nobody owes anybody.\n";
  }else{
    for(const f of FRIENDS) for(const x of t.transfers.filter(x=>x.from===f)){
      s+="\n• *"+f+"* → *"+x.to+"*  ·  *"+rupee(x.amount)+"*";
      const w=why(x); if(w) s+="\n   _"+w+"_";
    }
    s+="\n";
    const square=FRIENDS.filter(f=>!t.transfers.some(x=>x.from===f));
    if(square.length) s+="\n✅ Nothing to pay: "+square.join(", ")+"\n";
  }

  s+=rule+"📊 *EVERYONE'S NUMBERS*\n";
  for(const f of FRIENDS){
    const bal=t.net[f];
    s+="\n"+(bal>0?"🟢":bal<0?"🔴":"⚪")+" *"+f+"* — "
      +(bal>0?"gets back *"+rupee(bal)+"*":bal<0?"owes *"+rupee(-bal)+"*":"all square");
    s+="\n   _spent "+rupee(t.paid[f])+" · his share "+rupee(t.share[f])+"_";
  }
  s+="\n";

  if(state.paybacks.length){
    s+=rule+"🤝 *ALREADY PAID BACK*\n";
    for(const p of state.paybacks) s+="\n• "+p.from+" → "+p.to+"  ·  "+rupee(p.amount);
    s+="\n";
  }

  return s+rule+"💰 Total spent so far: *"+rupee(t.total)+"*";
}
function shareWA(){ window.open("https://wa.me/?text="+encodeURIComponent(whatsappText()),"_blank"); }

    nav.style.display="none"; st.style.display="none";
    rl.textContent=""; ft.textContent="";
    document.getElementById("install").innerHTML="";
    document.getElementById("view").innerHTML=gate;
    return;
  }
  nav.style.display=""; st.style.display="";

  const t=calc();
  updateStatus(t);
  rl.innerHTML = canEdit()
    ? `<b>${esc(OWNER)}</b> · you can add and remove things`
    : `<b>${esc(state.me||"Guest")}</b> · you can look, not change`;
  ft.textContent = canEdit()
    ? "Shared live with everyone you invited."
    : "Read only — only "+OWNER+" can change anything here.";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===state.tab));
  document.getElementById("view").innerHTML =
    state.tab==="log" ? viewLog(t) : state.tab==="trip" ? viewTrip(t) : viewSettle(t);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

// ---- add to home screen ----
let deferredPrompt=null;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){
  const slot=document.getElementById("install");
  // Already on the home screen, or told once that it is — then stop offering.
  // Android fires no event when the browser menu was used instead of the
  // button, so "already done" is the only thing that reliably clears it.
  if(isStandalone || ls(IK) || (!deferredPrompt && !isIOS)){ slot.innerHTML=""; return; }
  slot.innerHTML=`<section>
    <div class="shead">
      <div class="kicker">Install</div>
      <button class="link" onclick="ls(IK,'1');renderInstall()">Already done</button>
    </div>
    ${deferredPrompt
      ? `<div class="hint">Runs fullscreen and keeps working offline.</div>
         <button class="btn" onclick="doInstall()">Add to home screen</button>`
      : `<div class="hint">Safari → Share → <b>Add to Home Screen</b>.</div>`}
  </section>`;
}
function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; renderInstall(); });
}
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
addEventListener("appinstalled",()=>{ deferredPrompt=null; ls(IK,"1"); renderInstall(); });

if("serviceWorker" in navigator){
  // Network first: online you always get the current build, offline you get the
  // last one that loaded. The old cache-first worker could never update itself.
  const sw="const C='tripsplit-v5';"
    +"self.addEventListener('install',e=>self.skipWaiting());"
    +"self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));"
    +"self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;"
    +"e.respondWith(fetch(e.request).then(res=>{const c=res.clone();caches.open(C).then(k=>k.put(e.request,c).catch(()=>{}));return res;}).catch(()=>caches.match(e.request)));});";
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}

const manifest={
  name:"Trip Split", short_name:"Trip Split", display:"standalone",
  background_color:"#f7f7f7", theme_color:"#ffffff", start_url:".",
  icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%23101010'/%3E%3Cpath d='M60 150L132 42' stroke='%23fff' stroke-width='14'/%3E%3C/svg%3E", sizes:"192x192", type:"image/svg+xml"}]
};
const mlink=document.createElement("link");
mlink.rel="manifest";
mlink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
document.head.appendChild(mlink);

async function boot(){
  const q = new URLSearchParams(location.search);
  const owner = q.get("owner"), join = q.get("join");
  if(owner || join) history.replaceState(null, "", location.pathname);  // keep tokens out of the address bar

  if(owner){ KEY = owner; ls(KK, owner); }
  else KEY = ls(KK) || null;

  // Put the last known ledger on screen at once, then go and get the real one.
  try{
    const c = JSON.parse(ls(CK) || "null");
    if(c && KEY) applyLedger(c, false);
  }catch(e){}
  render();

  // An invite link always asks for a name — unless it is the same link this
  // browser already used, in which case there is nothing left to ask.
  if(join && !(KEY && ls(JK) === join)){
    state.joinToken = join; state.gate = "join"; state.gateMsg = "";
    render();
    return;
  }
  if(!KEY){ state.gate = "noinvite"; render(); return; }

  try{
    await refresh();
    if(canEdit()) await migrateLocal();
  }catch(e){
    // No signal. Keep showing the cached copy if there is one; say so if not.
    if(!state.expenses.length && !state.paybacks.length){
      state.gate = "badkey";
      state.gateMsg = "No signal, and nothing saved on this phone yet. Try again once you are back online.";
    }
  }
  render();
  renderInstall();
}

boot();
</script>
