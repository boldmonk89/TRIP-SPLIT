<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Archivo:wght@400;500;600;700&display=swap');
  :root{
    --paper:#f4efe5; --card:#fffdf8; --ink:#1c1712; --sub:#7c6f60; --line:rgba(28,23,18,.10);
    --pine:#2f4a3a; --pineDk:#1e3327; --clay:#c25b3a; --gold:#c79a4a; --moss:#6b7f4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:36px;line-height:1.5}
  input,select,button{font-family:inherit;font-size:14px}
  button{cursor:pointer;transition:transform .08s ease,background .15s,border-color .15s,box-shadow .15s}
  button:active{transform:scale(.98)}
  input:focus,select:focus{outline:none;border-color:var(--pine)!important;box-shadow:0 0 0 3px rgba(47,74,58,.12)}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .wrap{max-width:540px;margin:0 auto;padding:0 14px}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rise{animation:rise .22s ease both}

  .header{background:linear-gradient(155deg,var(--pine),var(--pineDk));color:#f4efe5;padding:20px 18px 24px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(30,51,39,.18)}
  .htitle{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:900;font-size:24px;letter-spacing:-.01em}
  .hsub{font-size:12.5px;color:rgba(244,239,229,.65);margin-top:2px;margin-left:28px}
  .hstats{display:flex;gap:10px;margin-top:18px}
  .hstat{flex:1;background:rgba(255,255,255,.08);border-radius:13px;padding:11px 13px}
  .hstat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(244,239,229,.55)}
  .hstat .v{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-top:3px}

  .tabs{display:flex;gap:5px;margin-top:16px;background:#e7ddca;padding:5px;border-radius:14px;position:sticky;top:6px;z-index:5;box-shadow:0 2px 10px rgba(28,23,18,.06)}
  .tab{flex:1;border:none;border-radius:10px;padding:11px 6px;font-size:13.5px;font-weight:600;background:transparent;color:var(--sub)}
  .tab.on{background:var(--pine);color:#fff;box-shadow:0 2px 8px rgba(47,74,58,.25)}

  .sec{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 6px rgba(28,23,18,.04)}
  .sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
  .sectitle{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:17px}
  .subline{font-size:12.5px;color:var(--sub)}

  .lbl{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
  .inp{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);font-size:14.5px;background:var(--card)}
  .row{display:flex;gap:9px}

  .chip{border:1.5px solid rgba(28,23,18,.13);background:var(--card);color:var(--sub);border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .chip.on{color:#fff}
  .benchip{border:1.5px solid rgba(28,23,18,.13);background:var(--card);color:#a89a8a;border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .benchip.on{border-color:var(--pine);background:#dbe6d6;color:#1e3327}

  .btn-primary{width:100%;margin-top:15px;border:none;background:var(--clay);color:#fff;border-radius:12px;padding:14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 4px 14px rgba(194,91,58,.28)}
  .btn-wa{width:100%;margin-top:16px;border:none;background:#22a45a;color:#fff;border-radius:13px;padding:15px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(34,164,90,.28)}
  .btn-ghost{border:none;background:#e7ddca;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .btn-ghost.on{background:var(--pine);color:#fff}

  .avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}

  .exp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(28,23,18,.04)}
  .expicon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .expname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .expmeta{font-size:12px;color:var(--sub);margin-top:1px}
  .expamt{font-family:'Fraunces',serif;font-weight:600;font-size:16px}
  .rm{border:none;background:transparent;color:#c08575;padding:2px 0;display:flex;align-items:center;gap:3px;font-size:11.5px;margin-left:auto}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 5px rgba(28,23,18,.04);overflow:hidden}
  .phead{width:100%;border:none;background:transparent;padding:16px;text-align:left;display:flex;justify-content:space-between;align-items:center}
  .pill{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:100px;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .pill.pos{background:#dbe6d6;color:#1e3327}
  .pill.neg{background:#f6dcd2;color:#a8492d}

  .note{font-size:13px;color:#5a5245;background:#f0e7d4;border-left:3px solid var(--clay);padding:12px 14px;border-radius:0 11px 11px 0;line-height:1.5;margin-top:16px}
  .totbox{margin-top:14px;background:var(--ink);color:#f4efe5;border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(28,23,18,.2)}
  .sumrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(244,239,229,.12);font-size:14px}
  .sumrow .v{font-family:'Fraunces',serif;font-weight:600}
  .foot{text-align:center;margin-top:22px;font-size:11.5px;color:#a89a8a}
  .install{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(28,23,18,.04)}
  .install h4{font-family:'Fraunces',serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .install p{font-size:13px;color:var(--sub);line-height:1.55}
  .install .steps{margin-top:10px;font-size:13px;color:#5a5245;line-height:1.7}
  .install b{color:var(--ink)}
  .btn-install{width:100%;margin-top:12px;border:none;background:var(--pine);color:#fff;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 4px 14px rgba(47,74,58,.24)}
  .install{margin-top:14px;background:linear-gradient(100deg,var(--gold),#b0842e);color:#2a2010;border:none;border-radius:14px;padding:13px 16px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(199,154,74,.3)}
  .ios-tip{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:#5a5245;line-height:1.6}
  .ios-tip b{color:var(--ink)}
  .ios-tip .close{float:right;border:none;background:transparent;color:var(--sub);font-size:18px;line-height:1;padding:0 0 6px 8px}

  .icon{width:1em;height:1em;display:inline-block;vertical-align:-.125em;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style>
</head>
<body>

<div class="header">
  <div class="htitle">
    <svg class="icon" style="width:20px;height:20px;color:var(--gold)" viewBox="0 0 24 24"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
    Trip Split
  </div>
  <div class="hsub">Mussoorie · Dhanaulti · 5 friends · 8–11 Sept</div>
  <div class="hstats" id="hstats"></div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-tab="add">Add</button>
    <button class="tab" data-tab="people">Balances</button>
    <button class="tab" data-tab="cats">Breakdown</button>
  </div>
  <div id="view"></div>
  <div id="install-slot"></div>
  <div class="foot">✓ Saved on this device · share with the group anytime</div>
</div>

<script>
const FRIENDS = ["Archit","Satwik","Kripansh","Tejas","Akshat"];
const DEFAULT_CAPITAL = 9000;
const AV_COLORS = ["#c25b3a","#6b7f4a","#a8763a","#3a6b5a","#8a4a6a"];

const CATS = {
  car:      {label:"Car",      color:"#6b7f4a", split:"shared",     icon:'<path d="M5 17H3v-6l2-5h10l2 5v6h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>'},
  fuel:     {label:"Fuel",     color:"#c25b3a", split:"shared",     icon:'<path d="M3 22h12V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M15 8h2a2 2 0 0 1 2 2v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V7l-3-3"/><path d="M6 6h6"/>'},
  toll:     {label:"Toll",     color:"#a8763a", split:"shared",     icon:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8M8 11h8M8 15h5"/>'},
  stay:     {label:"Stay",     color:"#2f4a3a", split:"shared",     icon:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>'},
  food:     {label:"Food",     color:"#8a5a2a", split:"shared",     icon:'<path d="M3 2v7c0 1 1 2 2 2h0c1 0 2-1 2-2V2M5 2v9M11 2v20M11 8c0-3 1-6 4-6v20"/>'},
  activity: {label:"Activity", color:"#3a6b5a", split:"shared",     icon:'<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>'},
  shopping: {label:"Shopping", color:"#8a4a6a", split:"individual", icon:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>'},
};

const DEFAULT_TOLL = 1150;  // Expressway toll + parking — editable
const DEFAULT_FUEL  = 6000; // ~780 km petrol — editable
const DEPOSIT = 2000;       // Refundable security deposit — comes back ÷5 to everyone

const CARS = {
  sonet:{label:"Kia Sonet", sub:"Self-drive · Revv", amount:8334},
  creta:{label:"Creta",     sub:"With driver",       amount:12800},
};
// essentials total (car + toll + fuel + deposit-if-not-refunded), and per-head
function essentialsTotal(){
  const e=state.essentials;
  return CARS[e.car].amount + (Number(e.toll)||0) + (Number(e.fuel)||0) + (e.depositRefunded?0:DEPOSIT);
}
function essentialsPerHead(){ return essentialsTotal()/FRIENDS.length; }

const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const icon = (path, sz=16, color="currentColor") => `<svg class="icon" style="width:${sz}px;height:${sz}px;color:${color}" viewBox="0 0 24 24">${path}</svg>`;
const ICN = {
  plus:'<path d="M12 5v14M5 12h14"/>', trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4M4 6v12a2 2 0 0 0 2 2h14v-4"/><circle cx="16" cy="12" r="1"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', pencil:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7 21l-4 1 1-4z"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>',
  car:'<path d="M5 17H3v-6l2-5h10l2 5v6h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
};

// ---- state ----
let state = {
  capitals: Object.fromEntries(FRIENDS.map(f=>[f,DEFAULT_CAPITAL])),
  expenses: [], // manual items only: food, activity, stay, shopping, etc.
  essentials: { car:"sonet", toll:DEFAULT_TOLL, fuel:DEFAULT_FUEL, depositRefunded:false },
  tab: "add",
  // form
  cat: "food", payer: FRIENDS[0], beneficiaries: FRIENDS.slice(),
  editingCap: false, openPerson: null,
};

// ---- persistence ----
function save(){
  try{
    localStorage.setItem("tripsplit:capitals", JSON.stringify(state.capitals));
    localStorage.setItem("tripsplit:expenses", JSON.stringify(state.expenses));
    localStorage.setItem("tripsplit:essentials", JSON.stringify(state.essentials));
  }catch(e){}
}
function load(){
  try{
    const c=localStorage.getItem("tripsplit:capitals"); if(c) state.capitals=JSON.parse(c);
    const es=localStorage.getItem("tripsplit:essentials");
    if(es){ state.essentials={...state.essentials, ...JSON.parse(es)}; }
    const e=localStorage.getItem("tripsplit:expenses");
    if(e){
      let parsed=JSON.parse(e);
      // migrate old saves: drop any old fixed car/toll/fuel lines, keep manual items only
      state.expenses = parsed.filter(x=>!x.fixed);
    }
  }catch(e){}
}

// ---- calculations ----
function calc(){
  const paid=Object.fromEntries(FRIENDS.map(f=>[f,0]));
  const owed=Object.fromEntries(FRIENDS.map(f=>[f,0]));
  let sharedTotal=0, individualTotal=0, grand=0;
  const catTotals=Object.fromEntries(Object.keys(CATS).map(k=>[k,0]));

  // essentials: car + toll + fuel + deposit(if not refunded) — always split 5 ways, from the pool (no single payer)
  const ess=state.essentials;
  const carAmt=CARS[ess.car].amount, tollAmt=Number(ess.toll)||0, fuelAmt=Number(ess.fuel)||0;
  const depositAmt = ess.depositRefunded ? 0 : DEPOSIT;
  catTotals.car=carAmt; catTotals.toll=tollAmt; catTotals.fuel=fuelAmt;
  const essTotal=carAmt+tollAmt+fuelAmt+depositAmt;
  grand+=essTotal; sharedTotal+=carAmt+tollAmt+fuelAmt; // deposit tracked separately below
  const essShare=essTotal/FRIENDS.length;
  for(const f of FRIENDS) owed[f]+=essShare;

  // manual expenses
  for(const e of state.expenses){
    paid[e.payer]=(paid[e.payer]||0)+e.amount;
    catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount; grand+=e.amount;
    const bens=(e.beneficiaries&&e.beneficiaries.length)?e.beneficiaries:(e.split==="individual"?[e.payer]:FRIENDS);
    const share=e.amount/bens.length;
    for(const b of bens) owed[b]=(owed[b]||0)+share;
    if(e.split==="individual") individualTotal+=e.amount; else sharedTotal+=e.amount;
  }
  const capTotal=FRIENDS.reduce((s,f)=>s+(Number(state.capitals[f])||0),0);
  const net=Object.fromEntries(FRIENDS.map(f=>[f,(Number(state.capitals[f])||0)-owed[f]]));
  return {paid,owed,sharedTotal,individualTotal,grand,catTotals,capTotal,net,essTotal,depositAmt,carAmt,tollAmt,fuelAmt};
}

function avatar(name,sz){
  const i=FRIENDS.indexOf(name); const bg=AV_COLORS[i>=0?i:0];
  return `<div class="avatar" style="width:${sz}px;height:${sz}px;background:${bg};font-size:${sz*0.42}px">${name[0]}</div>`;
}

// ---- actions ----
function switchCar(k){
  state.essentials.car=k;
  save(); render();
}
function setToll(v){ state.essentials.toll = v===""?"":Number(v); save(); updateHeader(); updateEssNote(); }
function setFuel(v){ state.essentials.fuel = v===""?"":Number(v); save(); updateHeader(); updateEssNote(); }
function fixToll(){ if(state.essentials.toll===""||isNaN(state.essentials.toll)) state.essentials.toll=0; save(); render(); }
function fixFuel(){ if(state.essentials.fuel===""||isNaN(state.essentials.fuel)) state.essentials.fuel=0; save(); render(); }
function toggleDeposit(){ state.essentials.depositRefunded=!state.essentials.depositRefunded; save(); render(); }
function updateEssNote(){
  const el=document.getElementById("essNote");
  if(el) el.innerHTML = essNoteHTML();
}
function essNoteHTML(){
  const ess=state.essentials;
  return `<b style="color:var(--ink)">${rupee(essentialsTotal())} total</b> = Car ${rupee(CARS[ess.car].amount)} + Toll ${rupee(Number(ess.toll)||0)} + Fuel ${rupee(Number(ess.fuel)||0)}${ess.depositRefunded?'':' + Deposit '+rupee(DEPOSIT)} → <b style="color:var(--ink)">${rupee(essentialsPerHead())}/head</b>.`;
}
function setCat(k){
  state.cat=k;
  state.beneficiaries = CATS[k].split==="individual" ? [state.payer] : FRIENDS.slice();
  render();
}
function toggleBen(f){
  const i=state.beneficiaries.indexOf(f);
  if(i>=0) state.beneficiaries.splice(i,1); else state.beneficiaries.push(f);
  render();
}
function addExpense(){
  const desc=document.getElementById("f-desc").value.trim();
  const amt=parseFloat(document.getElementById("f-amt").value);
  if(!amt||amt<=0||!desc){ alert("Add a name and amount first."); return; }
  const split=CATS[state.cat].split;
  const bens=split==="individual"?[state.payer]:(state.beneficiaries.length?state.beneficiaries.slice():FRIENDS.slice());
  state.expenses.push({id:Date.now(),cat:state.cat,desc,amount:amt,payer:state.payer,split,beneficiaries:bens});
  save(); render();
}
function delExpense(id){ state.expenses=state.expenses.filter(e=>e.id!==id); save(); render(); }
function resetAll(){
  if(!confirm("Reset all expenses and capital? This can't be undone.")) return;
  state.expenses=[];
  state.essentials={ car:state.essentials.car, toll:DEFAULT_TOLL, fuel:DEFAULT_FUEL, depositRefunded:false };
  state.capitals=Object.fromEntries(FRIENDS.map(f=>[f,DEFAULT_CAPITAL]));
  save(); render();
}
function setCapital(f,v){ state.capitals[f]= v===""?"":Number(v); save(); updateHeader(); }
function fixCapital(f){ if(state.capitals[f]===""||isNaN(state.capitals[f])) state.capitals[f]=0; save(); render(); }
function everyoneToggle(){
  state.beneficiaries = state.beneficiaries.length===FRIENDS.length ? [state.payer] : FRIENDS.slice();
  render();
}

function whatsappText(){
  const t=calc();
  let s="🏔️ *Mussoorie–Dhanaulti Trip · Split*\n";
  s+="8–11 Sept · 5 friends · 🚗 "+CARS[state.essentials.car].label+"\n━━━━━━━━━━━━━━\n\n";
  s+="💰 *Total spent: "+rupee(t.grand)+"*\n";
  s+="   Shared "+rupee(t.sharedTotal)+" · Personal "+rupee(t.individualTotal)+"\n";
  s+= state.essentials.depositRefunded ? "   Deposit: refunded ✅\n\n" : `   Includes ${rupee(DEPOSIT)} refundable deposit — back within 48 hrs after the trip (~13 Sept), ${rupee(DEPOSIT/FRIENDS.length)}/head\n\n`;
  s+="👥 *Each person:*\n";
  for(const f of FRIENDS){
    const bal=t.net[f];
    s+=`\n*${f}*\n  Put in: ${rupee(state.capitals[f]||0)}\n  Trip cost: ${rupee(t.owed[f])}\n`;
    s+= bal>=0 ? `  Gets back: ${rupee(bal)} ✅\n` : `  Add more: ${rupee(-bal)} ⚠️\n`;
  }
  s+="\n━━━━━━━━━━━━━━\n📊 *By category:*\n";
  for(const k of Object.keys(CATS)) if(t.catTotals[k]>0) s+=`  ${CATS[k].label}: ${rupee(t.catTotals[k])}\n`;
  s+="\n_Full breakdown in the app_ 🚗";
  return s;
}
function shareWA(){ window.open("https://wa.me/?text="+encodeURIComponent(whatsappText()),"_blank"); }

// ---- Add to Home Screen ----
let deferredPrompt=null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){
  const slot=document.getElementById("install-slot");
  if(isStandalone){ slot.innerHTML=""; return; } // already installed → hide
  if(deferredPrompt){
    // Android / Chrome — real install button
    slot.innerHTML=`<div class="install">
      <h4>${icon(ICN.plus,17,'var(--pine)')} Add to Home Screen</h4>
      <p>Install this like an app — opens fullscreen, works offline, your data stays saved.</p>
      <button class="btn-install" onclick="doInstall()">${icon(ICN.plus,17)} Install app</button>
    </div>`;
  } else if(isIOS){
    slot.innerHTML=`<div class="install">
      <h4>${icon(ICN.plus,17,'var(--pine)')} Add to Home Screen</h4>
      <p class="steps">On iPhone: tap the <b>Share</b> button in Safari, then <b>“Add to Home Screen”</b>. It opens like an app and keeps your data.</p>
    </div>`;
  } else {
    slot.innerHTML=`<div class="install">
      <h4>${icon(ICN.plus,17,'var(--pine)')} Add to Home Screen</h4>
      <p class="steps">Open your browser menu (⋮) and tap <b>“Add to Home screen”</b> / <b>“Install app”</b>. Opens like an app and keeps your data saved.</p>
    </div>`;
  }
}
function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; renderInstall(); });
}
window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; renderInstall(); });

// register a tiny inline service worker so it's installable + works offline after first open
if('serviceWorker' in navigator){
  const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.open('tripsplit-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;}).catch(()=>r))))});";
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// inject web app manifest dynamically (so single-file still installs)
const manifest={
  name:"Trip Split", short_name:"Trip Split", display:"standalone",
  background_color:"#f4efe5", theme_color:"#2f4a3a", start_url:".",
  icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%232f4a3a'/%3E%3Cpath d='M64 42 96 106 136 66 165 150 H48 z' fill='%23c79a4a'/%3E%3C/svg%3E", sizes:"192x192", type:"image/svg+xml"}]
};
const mlink=document.createElement('link');
mlink.rel='manifest';
mlink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
document.head.appendChild(mlink);

load();
render();
renderInstall();
</script>
